<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ṭāb (طاب)</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:14px;font-family:'Segoe UI',sans-serif;background:linear-gradient(135deg,#2C1810,#4A3428,#2C1810);color:#E8D5B7}
h1{color:#DAA520;font-size:26px;letter-spacing:2px}
.sub{font-size:11px;opacity:.7;margin-bottom:8px}
.game{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;width:100%;max-width:950px}
.board-wrap{flex:1;min-width:0;max-width:600px}
canvas{border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.5);cursor:pointer;display:block;max-width:100%}
.ctrl{width:320px;display:flex;flex-direction:column;gap:6px}
.st{padding:10px;border-radius:8px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);font-size:13px;min-height:36px;line-height:1.4}
.st.w{background:rgba(0,200,0,.2)}.st.l{background:rgba(200,0,0,.2)}
.b1{padding:11px;font-size:15px;font-weight:bold;border-radius:8px;border:none;cursor:pointer;background:linear-gradient(135deg,#DAA520,#B8860B);color:#FFF}.b1:disabled{background:#555;cursor:default}
.b2{padding:5px 8px;font-size:11px;border-radius:6px;border:1px solid #555;background:rgba(255,255,255,.05);color:#E8D5B7;cursor:pointer}.b2:hover{background:rgba(255,255,255,.1)}.b2.on{border-color:#00FF88;background:rgba(0,255,136,.1)}
.dp{padding:8px;border-radius:8px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15)}
.lg{height:180px;overflow-y:auto;padding:5px 8px;border-radius:8px;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.1);font-size:10px;line-height:1.6}
.lt{color:#DAA520;font-weight:bold}.lc{color:#FF6B6B;font-weight:bold}.la{color:#C0C0C0}.lw{color:#00FF88;font-weight:bold;font-size:12px}.ln{color:#B0A080}.lm{color:#88CCFF}
.lhl{background:rgba(218,165,32,.15)!important;border-left:3px solid #DAA520;padding-left:5px}
.nav{display:flex;gap:4px;align-items:center;background:rgba(0,0,0,.2);padding:5px 8px;border-radius:8px}
.nav button{padding:3px 9px;font-size:13px;border-radius:4px;border:1px solid #555;background:rgba(255,255,255,.05);color:#E8D5B7;cursor:pointer}
.nav button:hover{background:rgba(255,255,255,.1)}.nav button:disabled{opacity:.3;cursor:default}
.nav span{font-size:10px;flex:1;text-align:center;opacity:.7}
@media(max-width:700px){
  body{padding:8px}
  h1{font-size:22px}
  .game{flex-direction:column;align-items:center}
  .board-wrap{width:100%;max-width:100%}
  .ctrl{width:100%;max-width:100%}
  .b2{padding:6px 6px;font-size:10px}
}
/* Agent selectors. A light field with dark text is the only combination
   every browser renders correctly for <option>: a dark <select> keeps its
   colour on the closed control but the popup list falls back to the OS
   white background, which left pale text on white and was unreadable. */
.agentSel{padding:5px 7px;font-size:11px;font-weight:600;border-radius:4px;
  border:1px solid #8A6A3A;background:#F5E6D3;color:#241A11;cursor:pointer;
  max-width:100%}
.agentSel:hover{border-color:#C9A227}
.agentSel:focus{outline:2px solid #C9A227;outline-offset:1px}
.agentSel option{background:#F5E6D3;color:#241A11;padding:3px 6px}
.agentSel optgroup{background:#E2CBA6;color:#4A3212;font-weight:700;
  font-style:normal}
/* Which engines are playing right now -- readable at a glance, and it is
   what a screenshot of any position should be able to prove. */
#matchup{font-size:12px;margin:5px 0;padding:5px 8px;border-radius:4px;
  background:#2E2114;border:1px solid #8A6A3A;color:#F5E6D3;line-height:1.45}
#matchup b{color:#FFD469}
</style>
</head>
<body>
<h1>ṭāb (طاب)</h1>
<p class="sub">Ahmad B. Hassanat, Ghada A. Altarawneh and Ahmad S. Tarawneh — Mutah University, Al-Karak, Jordan</p>
<div class="game">
<div class="board-wrap">
<div style="display:flex;justify-content:space-between;margin-bottom:4px;font-size:12px">
<span style="color:#C0C0C0">● P2: <span id="ac">8</span> <span id="p2cap" style="font-size:10px;opacity:.8"></span></span>
<span style="color:#DAA520">● P1: <span id="yc">8</span> <span id="p1cap" style="font-size:10px;opacity:.8"></span></span>
</div>
<canvas id="bd"></canvas>
</div>
<div class="ctrl">
<div id="st" class="st">🎲 Click "Throw Sticks"!</div>
<button id="tb" class="b1" onclick="doThrow()">🪵 Throw Sticks</button>
<div id="dpn" class="dp" style="display:none">
<div style="font-size:11px;opacity:.7">Throw: <span id="ts"></span></div>
<div id="valinfo" style="font-size:11px;margin:3px 0;color:#00FF88"></div>
</div>
<div id="matchup">Engines &mdash; P1: <b>TLA-S</b> &nbsp;|&nbsp; P2: <b>GA-Original</b></div>
<div style="display:flex;gap:4px;flex-wrap:wrap">
<button class="b2" onclick="doNew()">🔄 New</button>
<button id="ab" class="b2" onclick="togAI()">🤖 AI vs AI: OFF</button>
<button id="sk" class="b2" style="display:none" onclick="doSkip()">Skip →</button>
<button id="spb" class="b2" onclick="togSpd()">⏩ Normal</button>
<button class="b2" onclick="exportLog()">📋 Export</button>
<button class="b2" id="asBtn" onclick="togAutoSave()" title="Auto-save game log when game ends">💾 Auto-Save: ON</button>
<select id="aiSel1" class="agentSel" onchange="aiModeP1=this.value;updMatchup()" title="P1 Engine">
<optgroup label="Agents reported in the paper (rank = Table VII, balanced 10)">
<option value="nnla">P1: TLA-NN &#8212; learned + lookahead (rank 1)</option>
<option value="nn">P1: TD-Greedy &#8212; learned, no search (rank 2)</option>
<option value="tlas" selected>P1: TLA-S &#8212; repaired stacking (rank 3)</option>
<option value="tla">P1: TLA (rank 4)</option>
<option value="tlab">P1: TLA-B &#8212; always sample (rank 5)</option>
<option value="original">P1: GA-Original (rank 6)</option>
<option value="tlag">P1: TLA-G &#8212; lookahead off (rank 8)</option>
<option value="psa">P1: PSA (rank 10)</option>
</optgroup>
<optgroup label="Prototype bots (not evaluated in the paper)">
</optgroup>
</select>
<select id="aiSel2" class="agentSel" onchange="aiModeP2=this.value;updMatchup()" title="P2 Engine">
<optgroup label="Agents reported in the paper (rank = Table VII, balanced 10)">
<option value="nnla">P2: TLA-NN &#8212; learned + lookahead (rank 1)</option>
<option value="nn">P2: TD-Greedy &#8212; learned, no search (rank 2)</option>
<option value="tlas">P2: TLA-S &#8212; repaired stacking (rank 3)</option>
<option value="tla">P2: TLA (rank 4)</option>
<option value="tlab">P2: TLA-B &#8212; always sample (rank 5)</option>
<option value="original" selected>P2: GA-Original (rank 6)</option>
<option value="tlag">P2: TLA-G &#8212; lookahead off (rank 8)</option>
<option value="psa">P2: PSA (rank 10)</option>
</optgroup>
<optgroup label="Prototype bots (not evaluated in the paper)">
</optgroup>
</select>
</div>
<div class="nav" style="margin-top:3px">
<button id="nbk" onclick="navBack()" disabled>◀◀</button>
<button id="nb1" onclick="navPrev()" disabled>◀</button>
<span id="navinfo">Move 0/0</span>
<button id="nf1" onclick="navNext()" disabled>▶</button>
<button id="nfk" onclick="navEnd()" disabled>▶▶</button>
<button id="offBtn" class="b2" onclick="showOffspring()" style="font-size:10px;padding:3px 6px" title="Show all possible allocations for this move">📊</button>
</div>
<div id="offPanel" style="max-height:200px;overflow-y:auto;padding:6px;border-radius:6px;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.1);font-size:10px;font-family:Consolas,monospace;display:none;margin-top:3px"></div>
<div id="lg" class="lg"><div class="ln">Welcome to ṭāb!</div></div>
</div>
</div>
<script>
var C=8,R=4,SZ=R*C,P1=1,P2=-1;
var P1T=[8,9,10,11,12,13,14,15,23,22,21,20,19,18,17,16];
var P2T=[23,22,21,20,19,18,17,16,8,9,10,11,12,13,14,15];
var P1E=[24,25,26,27,28,29,30,31];
var P2E=[7,6,5,4,3,2,1,0];
var TL=16;

// Dynamic sizing
var CL=64,PD=24;
function resizeBoard(){
  var cv=document.getElementById('bd');
  var wrap=cv.closest('.board-wrap');
  var maxW=wrap?wrap.clientWidth:590;
  if(maxW<100)maxW=Math.min(window.innerWidth-20,590);
  CL=Math.floor((maxW-48)/C);
  if(CL>68)CL=68;
  if(CL<28)CL=28;
  PD=Math.max(14,Math.floor(CL*0.38));
  cv.width=PD*2+C*CL;
  cv.height=PD*2+R*CL;
  doDraw();
}
window.addEventListener('resize',function(){resizeBoard()});

var ce,fa,fq,pst,ph,ts,rm,mv,ss,wn,tn,lm,ehFresh;
var aim=false,ait=null,spd=500;
var p1cap=0,p2cap=0;
var hist=[],hIdx=0,viewing=false;
var destHL=[];
var aiMode='original'; // legacy fallback for human vs AI (synced from aiSel2)
var aiModeP1='tlas';
var aiModeP2='original';
var offData=null; // offspring data for current AI move

function init(){
  ce=[];for(var i=0;i<SZ;i++)ce[i]=0;
  for(var i=0;i<C;i++){ce[i]=1;ce[24+i]=-1}
  fa={};fa[1]={};fa[-1]={};
  for(var i=0;i<C;i++){fa[1][i]=1;fa[-1][24+i]=1}
  fq={};fq[1]=[0,1,2,3,4,5,6,7];fq[-1]=[31,30,29,28,27,26,25,24];
  pst={};pst[1]=false;pst[-1]=false;
  // NO RE-ENTRY: LIFO stacks. Key=pos, Value=[bool...] (true=tainted, top=last)
  nre={};nre[1]={};nre[-1]={};
  // BUG 1 FIX: per-turn "fresh" enemy-home soldiers (entered this turn, not yet frozen)
  ehFresh={};ehFresh[1]={};ehFresh[-1]={};
  ph='wait';ts=[];rm=[];mv=[];ss=null;wn=null;tn=0;lm=null;
  p1cap=0;p2cap=0;destHL=[];
  hist=[];hIdx=0;viewing=false;
  saveSnap('Start');
}

// =====================================================================
// HISTORY + LOG HIGHLIGHTING
// =====================================================================
function logCount(){return document.getElementById('lg').getElementsByTagName('div').length}

function saveSnap(desc){
  if(hIdx<hist.length-1)hist=hist.slice(0,hIdx+1);
  hist.push({ce:ce.slice(),fa0:JSON.parse(JSON.stringify(fa[1])),fa1:JSON.parse(JSON.stringify(fa[-1])),
    fq0:fq[1].slice(),fq1:fq[-1].slice(),ps0:pst[1],ps1:pst[-1],
    nre0:JSON.parse(JSON.stringify(nre[1])),nre1:JSON.parse(JSON.stringify(nre[-1])),
    ehf0:JSON.parse(JSON.stringify(ehFresh&&ehFresh[1]||{})),ehf1:JSON.parse(JSON.stringify(ehFresh&&ehFresh[-1]||{})),
    p1c:p1cap,p2c:p2cap,lm:lm?{from:lm.from,to:lm.to}:null,desc:desc,tn:tn,
    logEnd:logCount(),
    off:offData?{player:offData.player,soldiers:offData.soldiers.slice(),vals:offData.vals.slice(),preCe:offData.preCe.slice(),count:offData.count}:null});
  hIdx=hist.length-1;offData=null;updNav();
}

function loadSnap(idx){hIdx=idx;drawSnap(hist[idx]);highlightLog(idx);updNav()}

function drawSnap(s){
  var oc=ce,of=fa,oq=fq,ol=lm,o1=p1cap,o2=p2cap,onr=nre,oef=ehFresh;
  ce=s.ce;fa={};fa[1]=s.fa0;fa[-1]=s.fa1;fq={};fq[1]=s.fq0;fq[-1]=s.fq1;
  nre={};nre[1]=s.nre0||{};nre[-1]=s.nre1||{};
  ehFresh={};ehFresh[1]=s.ehf0||{};ehFresh[-1]=s.ehf1||{};
  lm=s.lm;p1cap=s.p1c;p2cap=s.p2c;doDraw();
  ce=oc;fa=of;fq=oq;lm=ol;p1cap=o1;p2cap=o2;nre=onr;ehFresh=oef;
}

function highlightLog(idx){
  var lg=document.getElementById('lg');
  var divs=lg.getElementsByTagName('div');
  // Clear all highlights
  for(var i=0;i<divs.length;i++)divs[i].classList.remove('lhl');
  // Find range: from previous snapshot's logEnd to this snapshot's logEnd
  var start=idx>0?hist[idx-1].logEnd:0;
  var end=hist[idx].logEnd;
  for(var i=start;i<end&&i<divs.length;i++){
    divs[i].classList.add('lhl');
  }
  // Scroll to first highlighted
  if(start<divs.length)divs[start].scrollIntoView({block:'center',behavior:'smooth'});
}

function clearLogHL(){
  var divs=document.getElementById('lg').getElementsByTagName('div');
  for(var i=0;i<divs.length;i++)divs[i].classList.remove('lhl');
}

function navBack(){viewing=true;loadSnap(0);doUI()}
function navPrev(){if(hIdx>0){viewing=true;loadSnap(hIdx-1);doUI()}}
function navNext(){if(hIdx<hist.length-1){loadSnap(hIdx+1);if(hIdx>=hist.length-1){viewing=false;clearLogHL()}doUI()}}
function navEnd(){viewing=false;hIdx=hist.length-1;destHL=[];clearLogHL();doDraw();updNav();doUI()}
function updNav(){
  document.getElementById('nbk').disabled=hIdx<=0;
  document.getElementById('nb1').disabled=hIdx<=0;
  document.getElementById('nf1').disabled=hIdx>=hist.length-1;
  document.getElementById('nfk').disabled=hIdx>=hist.length-1;
  document.getElementById('navinfo').textContent='Move '+hIdx+'/'+(hist.length-1)+(viewing?' (reviewing)':'');
}

// =====================================================================
// HELPERS
// =====================================================================
function gr(p){return Math.floor(p/C)}
function gc(p){return p%C}
function lab(p){return String.fromCharCode(65+gr(p))+(gc(p)+1)}
function vrow(r){return 3-r}
function isOwn(pos,pl){return pl===1?(pos<8):(pos>=24)}
function isEnm(pos,pl){return pl===1?(pos>=24):(pos<8)}
function getTrack(pl){return pl===1?P1T:P2T}
function getEnemy(pl){return pl===1?P1E:P2E}
function findOnTrack(pos,pl){var t=getTrack(pl);for(var i=0;i<TL;i++)if(t[i]===pos)return i;return -1}
function findOnEnemy(pos,pl){var e=getEnemy(pl);for(var i=0;i<e.length;i++)if(e[i]===pos)return i;return -1}
function hasBF(pl){for(var i=8;i<24;i++){if(ce[i]*pl>0)return true}return false}
function allFreed(pl){return fq[pl].length===0}
function hasActiveElsewhere(pl){
  var hs=pl===1?0:24,he=pl===1?8:32,fz=fa[pl]||{};
  for(var i=hs;i<he;i++){if(ce[i]*pl>0&&Math.abs(ce[i])>(fz[i]||0))return true}
  for(var i=8;i<24;i++){if(ce[i]*pl>0)return true}
  return false;
}

function isFrozenAt(pos,player){
  return isOwn(pos,player)&&ce[pos]*player>0&&(fa[player]||{})[pos]>0;
}

function freeDestination(pos,player){
  if(player===1) return pos===0?8:pos-1;
  return pos===31?23:pos+1;
}

// When a soldier is captured at pos, if it was in its owner's frozen queue, remove it
function cleanupCaptured(pos){
  // Check P1 queue
  if(pos<8){
    var qi=fq[1].indexOf(pos);
    if(qi>=0)fq[1].splice(qi,1);
    if(fa[1][pos])delete fa[1][pos];
  }
  // Check P2 queue
  if(pos>=24){
    var qi=fq[-1].indexOf(pos);
    if(qi>=0)fq[-1].splice(qi,1);
    if(fa[-1][pos])delete fa[-1][pos];
  }
}

// Can this frozen soldier be freed? Only if:
// a) it's next in queue, OR
// b) its free destination has an enemy to capture
function canFree(pos,player){
  if(!isFrozenAt(pos,player))return false;
  var q=fq[player];
  if(!q||!q.length)return false;
  // Next in queue — always allowed
  if(q[0]===pos)return true;
  // Not next in queue — only if destination has enemy (capture bypass)
  if(q.indexOf(pos)<0)return false; // not in queue at all
  var dest=freeDestination(pos,player);
  if(ce[dest]*player<0)return true; // enemy there — capture bypass!
  return false;
}

// =====================================================================
// MOVEMENT
// =====================================================================
function moveSteps(fromPos,steps,player){
  if(isOwn(fromPos,player)){
    if(steps<=0)return[];
    if(player===1){
      var t=fromPos-steps;
      if(t>=0){
        // BUG 2 FIX: cannot land on own still-in-queue (non-āṣram) home-row cell
        if((fa[1]||{})[t]>0)return[];
        return[t];
      }
      return[getTrack(player)[(steps-fromPos-1)%TL]]
    }
    else{
      var t=fromPos+steps;
      if(t<=31){
        // BUG 2 FIX: cannot land on own still-in-queue (non-āṣram) home-row cell
        if((fa[-1]||{})[t]>0)return[];
        return[t];
      }
      return[getTrack(player)[(steps-(31-fromPos)-1)%TL]]
    }
  }
  if(isEnm(fromPos,player)){
    // BUG 1 FIX: a soldier that entered enemy home THIS TURN stays movable until turn ends
    if(hasActiveElsewhere(player)&&!((ehFresh&&ehFresh[player]||{})[fromPos]>0))return[];
    var en=getEnemy(player),ei=findOnEnemy(fromPos,player);if(ei<0)return[];
    var ni=ei+steps;if(ni<en.length)return[en[ni]];
    return[getTrack(player)[(8+ni-en.length)%TL]];
  }
  var tr=getTrack(player),idx=findOnTrack(fromPos,player);if(idx<0)return[];
  var ni=idx+steps;if(ni<TL)return[tr[ni]];
  var ex=ni-TL,lp=tr[ex%TL];
  // NO RE-ENTRY: if any soldier in this stack is tainted, block enemy home
  var stk=(nre[player]||{})[fromPos]||[];
  var tainted=false;for(var si=0;si<stk.length;si++){if(stk[si])tainted=true}
  if(allFreed(player)&&!tainted){
    var en=getEnemy(player),ep=en[Math.min(ex,en.length-1)];
    if(lp===ep)return[lp];return[lp,ep];
  }
  return[lp];
}

// =====================================================================
// DICE
// =====================================================================
function throwOne(){var f=0;for(var i=0;i<4;i++)f+=Math.random()<.5?1:0;return f===0?6:f}
function throwTurn(){var s=[];while(true){var v=throwOne();s.push(v);if(v===2||v===3)break}return s}

// =====================================================================
// FREEING
// =====================================================================
function freeOne(player){
  var q=fq[player];if(!q||!q.length)return null;
  var hp=q.shift(),sn=player===1?1:-1;
  var np=freeDestination(hp,player);
  var a=fa[player];a[hp]=(a[hp]||1)-1;if(a[hp]<=0)delete a[hp];
  ce[hp]-=sn;var cap=0;
  if(ce[np]*player<0){cap=Math.abs(ce[np]);cleanupCaptured(np);ce[np]=0;if(player===1)p1cap+=cap;else p2cap+=cap}
  ce[np]+=sn;return{o:hp,n:np,c:cap};
}

function procFreeAI(player,seq){
  var r=seq.slice(),fd=0,fl=[];
  while(r.indexOf(1)>=0&&fq[player]&&fq[player].length>0){
    r.splice(r.indexOf(1),1);var x=freeOne(player);if(x){fd++;fl.push(x)}
  }
  if(seq.indexOf(1)>=0)pst[player]=true;
  if(!pst[player])r=[];
  return{r:r,fd:fd,fl:fl};
}

// Human: free a SPECIFIC soldier (for capture bypass)
function freeSpecific(player,pos){
  var sn=player===1?1:-1;
  var qi=fq[player].indexOf(pos);
  if(qi>=0)fq[player].splice(qi,1);
  var a=fa[player];a[pos]=(a[pos]||1)-1;if(a[pos]<=0)delete a[pos];
  var np=freeDestination(pos,player);
  ce[pos]-=sn;var cap=0;
  if(ce[np]*player<0){cap=Math.abs(ce[np]);cleanupCaptured(np);ce[np]=0;if(player===1)p1cap+=cap;else p2cap+=cap}
  ce[np]+=sn;return{o:pos,n:np,c:cap};
}

function procFreeHuman(seq){
  if(seq.indexOf(1)>=0)pst[1]=true;
  if(!pst[1])return{r:[],fd:0,fl:[]};
  return{r:seq.slice(),fd:0,fl:[]};
}

// =====================================================================
// APPLY MOVE
// =====================================================================
function doMove(fp,steps,player,ci){
  var sn=player===1?1:-1,tot=Math.abs(ce[fp]),frz=(fa[player]||{})[fp]||0,m=tot-frz;
  if(m<=0)return{np:fp,cap:0,ch:null,moved:false};
  var mc=(steps===1&&m>1)?1:m;
  var ds=moveSteps(fp,steps,player);if(!ds.length)return{np:fp,cap:0,ch:null,moved:false};
  if(ds.length>1&&ci===undefined)return{np:fp,cap:0,ch:ds,moved:false};
  var np=ds.length>1?ds[ci||0]:ds[0];
  if(np===fp)return{np:fp,cap:0,ch:null,moved:false};
  // LIFO taint: determine what moves
  var nr=nre[player]||{},stk=nr[fp]||[],wasEnm=isEnm(fp,player);
  var movingTaints=[];
  if(stk.length>0&&fp!==np){
    if(mc>=stk.length){movingTaints=stk.slice();delete nr[fp]}
    else{movingTaints=stk.slice(-mc);nr[fp]=stk.slice(0,-mc);if(!nr[fp].length)delete nr[fp]}
  }
  ce[fp]-=mc*sn;var cap=0;
  if(ce[np]*player<0){
    cap=Math.abs(ce[np]);cleanupCaptured(np);
    // Clear opponent taint at capture pos
    var opp=-player;if((nre[opp]||{})[np])delete nre[opp][np];
    ce[np]=0;if(player===1)p1cap+=cap;else p2cap+=cap;
  }
  ce[np]+=mc*sn;
  // Update taint at destination
  if(wasEnm&&!isEnm(np,player)){
    // Exiting enemy home → taint all
    if(!nr[np])nr[np]=[];for(var ti=0;ti<mc;ti++)nr[np].push(true);

function getMov(player,vals){

  for(var i=hs;i<he;i++){
    if(ce[i]*player>0&&Math.abs(ce[i])>(fz[i]||0))m.push(i);
  }
  // Battlefield
  for(var i=8;i<24;i++){if(ce[i]*player>0)m.push(i)}

  // Frozen āṣram: only if ṭāb available AND canFree passes
  if(vals&&vals.indexOf(1)>=0&&fq[player].length>0){
    for(var i=hs;i<he;i++){
      if(isFrozenAt(i,player)&&canFree(i,player)&&m.indexOf(i)<0)m.push(i);
    }
  }

  // Enemy home: split with ṭāb only if NOT frozen
  if(!ef&&vals&&vals.indexOf(1)>=0){
    for(var i=os;i<oe;i++){if(ce[i]*player>0&&Math.abs(ce[i])>1&&m.indexOf(i)<0)m.push(i)}
  }
  // BUG 1 FIX: fresh enemy-home soldiers (entered this turn) remain movable regardless of ef
  var ehf=(ehFresh&&ehFresh[player])||{};
  for(var i=os;i<oe;i++){
    if(ce[i]*player>0&&(ehf[i]||0)>0&&m.indexOf(i)<0)m.push(i);
  }
  if(m.length>0)return m;

  // Last resort: enemy home (unfrozen)
  if(!ef){for(var i=os;i<oe;i++){if(ce[i]*player>0)m.push(i)}}
  return m;
}

// =====================================================================
// PROBABILITY AI ENGINE — Exhaustive with subset-sum probabilities
// =====================================================================
var CAPTURE_PROB={1:0.286,2:0.632,3:0.572,4:0.227,5:0.080,6:0.149,7:0.099,8:0.089,9:0.073,10:0.043,11:0.022,12:0.023};

// Gateway ambush positions
var P1_GATEWAYS={15:'high',14:'mid',13:'low',16:'mid',17:'low'};
var P2_GATEWAYS={16:'high',17:'mid',18:'low',23:'high',22:'mid',21:'low',15:'low',14:'low'};
var GW_VALS={high:6,mid:4,low:2};

function probEval(c,player,captures){
  var f=0;
  var tr=getTrack(player),otr=getTrack(-player);
  var my=0,opp2=0;
  for(var i=0;i<SZ;i++){
    if(c[i]*player>0)my+=Math.abs(c[i]);
    else if(c[i]*player<0)opp2+=Math.abs(c[i]);
  }
  for(var i=0;i<SZ;i++){
    var val=c[i];if(val===0)continue;
    var owner=val>0?1:-1,cnt=Math.abs(val);
    var sign=(owner===player)?1:-1;
    // Safe zone check
    var safe=isOwn(i,owner);
    if(isEnm(i,owner)){
      var hasBF2=false;
      for(var bi=8;bi<24;bi++){if(c[bi]*owner>0){hasBF2=true;break}}
      if(!hasBF2){safe=true}else{f+=sign*(-cnt*3);continue}
    }
    // BASE VALUE
    var base=cnt*12;
    if(safe){base+=cnt*cnt*6}else{if(cnt>1)base-=cnt*cnt*5}
    f+=sign*base;
    // THREAT ANALYSIS (battlefield only)
    if(!safe){
      var oidx=-1;for(var oi=0;oi<otr.length;oi++)if(otr[oi]===i){oidx=oi;break}
      if(oidx>=0){
        var worstP=0;
        for(var d=1;d<=12;d++){
          var behind=((oidx-d)%TL+TL)%TL;
          var bp=otr[behind];
          if(c[bp]*owner<0){
            var p2=(CAPTURE_PROB[d]||0.01)*Math.abs(c[bp]);
            if(p2>worstP)worstP=p2;
          }
        }
        if(worstP>0){
          f-=sign*(worstP*cnt*cnt*20);
          if(worstP>0.5)f-=sign*(cnt*cnt*50);
          if(cnt>=3&&worstP>0.3)f-=sign*(cnt*cnt*70);
        }
      }
      // Asram threat
      var asramKP=0;
      var oppEntry=(owner===1)?23:8;
      if(i===oppEntry){
        var oppFrz=0;
        var ohs=(-owner)===1?0:24,ohe=(-owner)===1?8:32;
        for(var oi2=ohs;oi2<ohe;oi2++){if(c[oi2]*(-owner)>0)oppFrz+=Math.abs(c[oi2])}
        if(oppFrz>0){asramKP=1-Math.pow(0.75,Math.min(oppFrz,8));f-=sign*(asramKP*cnt*cnt*60)}
      }
    }
    // OFFENSIVE POTENTIAL — suppressed if doomed by asram
    var myIdx=-1;
    var myTr=(owner===player)?tr:otr;
    for(var oi3=0;oi3<myTr.length;oi3++)if(myTr[oi3]===i){myIdx=oi3;break}
    if(myIdx>=0&&!safe&&asramKP<0.3){
      for(var d=1;d<=6;d++){
        var ahead=myIdx+d;if(ahead>=TL)ahead=ahead%TL;
        var ap=myTr[ahead];
        if(c[ap]*owner<0){
          var p3=CAPTURE_PROB[d]||0.01;
          f+=sign*(p3*Math.abs(c[ap])*cnt*10);
        }
      }
    }
    // POSITIONAL HEURISTICS
    var row=Math.floor(i/8),col=i%8;
    if(owner===1){
      if(row===0&&col<=2){var enBF=0;for(var ei=8;ei<24;ei++){if(c[ei]<0)enBF+=Math.abs(c[ei])}if(enBF>0)f+=sign*cnt*8*Math.min(enBF,4)/4.0}
      if(row===1&&col>=5){var opH=0;for(var oi4=24;oi4<32;oi4++){if(c[oi4]<0)opH+=Math.abs(c[oi4])}if(opH>0)f+=sign*cnt*6*Math.min(opH,4)/4.0}
      if(row===2&&col>=5){var p2n=0;for(var ei2=8;ei2<24;ei2++){if(c[ei2]<0)p2n+=Math.abs(c[ei2])}for(var ei3=29;ei3<32;ei3++){if(c[ei3]<0)p2n+=Math.abs(c[ei3])}if(p2n>0)f-=sign*cnt*18*Math.min(p2n,3)/3.0}
    }else{
      if(row===3&&col>=5){var enBF2=0;for(var ei2=8;ei2<24;ei2++){if(c[ei2]>0)enBF2+=Math.abs(c[ei2])}if(enBF2>0)f+=sign*cnt*8*Math.min(enBF2,4)/4.0}
      if(row===2&&col<=2){var opH2=0;for(var oi5=0;oi5<8;oi5++){if(c[oi5]>0)opH2+=Math.abs(c[oi5])}if(opH2>0)f+=sign*cnt*6*Math.min(opH2,4)/4.0}
      if(row===1&&col<=2){var p1n=0;for(var ei4=8;ei4<24;ei4++){if(c[ei4]>0)p1n+=Math.abs(c[ei4])}for(var ei5=0;ei5<3;ei5++){if(c[ei5]>0)p1n+=Math.abs(c[ei5])}if(p1n>0)f-=sign*cnt*18*Math.min(p1n,3)/3.0}
    }
  }
  var cap=captures||0;f+=cap*cap*60;
  f+=(my-opp2)*12;
  return f;
}

// =====================================================================
// AHMAD'S V EVALUATOR — V = Σ S×(1-P)^S + λ×Σ P×E
// =====================================================================
function ahmadV(c,player,captures){
  var my=0,opp2=0;
  for(var i=0;i<SZ;i++){
    if(c[i]*player>0)my+=Math.abs(c[i]);
    else if(c[i]*player<0)opp2+=Math.abs(c[i]);
  }
  if(opp2===0)return 100000;
  if(my===0)return -100000;
  // λ: offense weight
  var lam=my>=opp2?3.0:(1.0+2.0*(my/Math.max(opp2,1)));
  var survival=0,attack=0;
  var otr=getTrack(-player),tr=getTrack(player);
  for(var i=0;i<SZ;i++){
    var val=c[i];if(val===0)continue;
    var owner=val>0?1:-1,cnt=Math.abs(val);
    var isMine=(owner===player);
    if(isMine){
      if(isOwn(i,owner)){
        survival+=cnt*1.0; // home=safe, P=0
      }else if(isEnm(i,owner)){
        survival+=cnt*Math.pow(0.75,cnt); // enemy home P=0.25
      }else{
        // Battlefield: compute P_i
        var pi=0;
        var oidx=-1;for(var oi=0;oi<otr.length;oi++)if(otr[oi]===i){oidx=oi;break}
        if(oidx>=0){
          for(var d=1;d<=12;d++){
            var behind=((oidx-d)%TL+TL)%TL;
            var bp=otr[behind];
            if(c[bp]*owner<0){
              var p2=(CAPTURE_PROB[d]||0.01)*Math.abs(c[bp]);
              if(p2>pi)pi=p2;
            }
          }
        }
        // Asram threat
        var oppEntry=(owner===1)?23:8;
        if(i===oppEntry){
          var oppFrz=0;
          var ohs=(-owner)===1?0:24,ohe=(-owner)===1?8:32;
          for(var oi2=ohs;oi2<ohe;oi2++){if(c[oi2]*(-owner)>0)oppFrz+=Math.abs(c[oi2])}
          if(oppFrz>0){var ap=1-Math.pow(0.75,Math.min(oppFrz,8));if(ap>pi)pi=ap}
        }
        pi=Math.min(1,pi);
        survival+=cnt*Math.pow(1-pi,cnt);
        // Attack potential (only if likely to survive)
        if(pi<0.4){
          var myTr=tr;
          var myIdx=-1;for(var oi3=0;oi3<myTr.length;oi3++)if(myTr[oi3]===i){myIdx=oi3;break}
          if(myIdx>=0){
            for(var d=1;d<=6;d++){
              var ahead=(myIdx+d)%TL;
              var ap2=myTr[ahead];
              if(c[ap2]*owner<0)attack+=(CAPTURE_PROB[d]||0.01)*Math.abs(c[ap2]);
            }
          }
        }
      }
    }else{
      // Opponent survival (subtract)
      if(isOwn(i,owner)){survival-=cnt*1.0}
      else if(isEnm(i,owner)){survival-=cnt*Math.pow(0.75,cnt)}
      else{
        var pi2=0;
        var oidx2=-1;for(var oi4=0;oi4<tr.length;oi4++)if(tr[oi4]===i){oidx2=oi4;break}
        if(oidx2>=0){
          for(var d=1;d<=12;d++){
            var behind2=((oidx2-d)%TL+TL)%TL;
            var bp2=tr[behind2];
            if(c[bp2]*owner<0){
              var p3=(CAPTURE_PROB[d]||0.01)*Math.abs(c[bp2]);
              if(p3>pi2)pi2=p3;
            }
          }
        }
        pi2=Math.min(1,pi2);
        survival-=cnt*Math.pow(1-pi2,cnt);
      }
    }
  }
  var cap=captures||0;
  return survival+lam*attack+cap*8.0;
}

function aiSimMove(cells,pos,val,player){
  // Simulate a single move on cells array (MUTATES cells). Returns new position.
  var sn=player===1?1:-1,tot=Math.abs(cells[pos]),m=tot;
  if(val===1&&m>1)m=1;
  var np2=pos;
  if(isOwn(pos,player)){
    if(player===1){var t=pos-val;if(t>=0)np2=t;else np2=getTrack(player)[(val-pos-1)%TL]}
    else{var t=pos+val;if(t<=31)np2=t;else np2=getTrack(player)[(val-(31-pos)-1)%TL]}
  }else if(isEnm(pos,player)){
    var en=getEnemy(player),ei=findOnEnemy(pos,player);if(ei<0)return pos;
    var ni=ei+val;
    if(ni<en.length)np2=en[ni];else np2=getTrack(player)[(8+ni-en.length)%TL];
  }else{
    var tr=getTrack(player),idx=findOnTrack(pos,player);if(idx<0)return pos;
    var ni=idx+val;
    if(ni<TL){np2=tr[ni]}
    else{
      // Past end of track — fork decision
      var ex=ni-TL,lp=tr[ex%TL];
      np2=lp; // default: loop
      // Check if fork to enemy home is available and better
      var stk=(nre[player]||{})[pos]||[];
      var tainted=false;for(var si=0;si<stk.length;si++){if(stk[si])tainted=true}
      if(allFreed(player)&&!tainted&&fq[player].length===0){
        var en=getEnemy(player),ep=en[Math.min(ex,en.length-1)];
        if(ep!==lp){
          // Evaluate both options, pick better
          var c1=cells.slice();c1[pos]-=m*sn;if(c1[lp]*player<0)c1[lp]=0;c1[lp]+=m*sn;
          var c2=cells.slice();c2[pos]-=m*sn;if(c2[ep]*player<0)c2[ep]=0;c2[ep]+=m*sn;
          var s1=probEval(c1,player),s2=probEval(c2,player);
          if(s2>s1)np2=ep; // enemy home is better
        }

  }

  cells[np2]+=m*sn;
  return{pos:np2,cap:cap};
}

// Simulate a complete allocation on a board copy. Returns {cells, captures}.
function simFullAlloc(boardCe,alloc,soldiers,player){
  var sc=boardCe.slice(),totalCap=0;

}

    }
  }
  return moved;
}

// =====================================================================
// PRIORITY AI ENGINE — Danger-first, anti-stack, anti-fork, ambush
// Ahmad's expert play heuristics
// =====================================================================

// Danger distances ranked by severity (capture probability)
// dist 2: P=0.632, dist 3: P=0.572, dist 1: P=0.286, dist 4: P=0.227
var DANGER_DISTS=[2,3,1,4];
var DANGER_PROBS={1:0.286,2:0.632,3:0.572,4:0.227};

// Compute danger level for a soldier at pos
// Uses direct reachability: for each enemy soldier, check if they can reach pos
// with a throw of 1,2,3,4 (the only single-throw values)
function computeDanger(pos,owner,cells){
  // Fast version: uses track-index arithmetic, no global state dependency.
  // Returns {maxP, threats} where maxP is highest capture probability from any enemy.
  if(isOwn(pos,owner))return{maxP:0,threats:[]};
  if(isEnm(pos,owner))return{maxP:0,threats:[]};
  var threats=[],maxP=0;
  var opp=-owner;
  var oppTrack=getTrack(opp);
  // Find pos on opponent's track
  var posIdx=findOnTrack(pos,opp);
  if(posIdx<0)return{maxP:0,threats:[]};
  for(var i=0;i<32;i++){
    if(cells[i]*opp<=0)continue;
    var oppIdx=findOnTrack(i,opp);
    if(oppIdx<0)continue;
    for(var d=0;d<DANGER_DISTS.length;d++){
      var dist=DANGER_DISTS[d];
      if(oppIdx+dist===posIdx){
        var p=DANGER_PROBS[dist];
        threats.push({dist:dist,prob:p,fromPos:i});
        if(p>maxP)maxP=p;
      }
    }
  }
  return{maxP:maxP,threats:threats};
}

// Compute danger at a destination position
function destDangerLevel(destPos,owner,cells){
  return computeDanger(destPos,owner,cells).maxP;
}

// Fixed ambush areas per player
// P1 ambush1: A1,A2,A3 = cells 0,1,2  |  P1 ambush2: B8,B7,B6 = cells 15,14,13
// P2 ambush1: D8,D7,D6 = cells 31,30,29  |  P2 ambush2: C1,C2,C3 = cells 16,17,18
var P1_AMBUSH=[0,1,2,15,14,13];
var P2_AMBUSH=[31,30,29,16,17,18];

function isAmbushPos(pos,player){
  var amb=player===1?P1_AMBUSH:P2_AMBUSH;
  for(var i=0;i<amb.length;i++)if(amb[i]===pos)return true;
  return false;
}

// Check anti-fork: is placing a soldier at destPos in enemy home
// AHEAD of the last enemy soldier? (suicidal)
function isSuicidalFork(destPos,player,cells){
  if(!isEnm(destPos,player))return false;
  var enmOwner=-player;
  var enemyHomeStart=enmOwner===1?0:24;
  var enemyHomeEnd=enmOwner===1?8:32;
  // Find the last enemy soldier (furthest along their circuit toward exit)
  var lastEnemyCol=-1;
  for(var i=enemyHomeStart;i<enemyHomeEnd;i++){
    if(cells[i]*enmOwner>0){
      var col=i%C;
      if(enmOwner===1){
        if(col>lastEnemyCol)lastEnemyCol=col;
      }else{
        if(lastEnemyCol<0||col<lastEnemyCol)lastEnemyCol=col;
      }
    }
  }
  if(lastEnemyCol<0)return false;
  var myCol=destPos%C;
  // Ahead = past them toward exit of their home
  if(enmOwner===1){
    return myCol<lastEnemyCol; // P1 exit is low col
  }else{
    return myCol>lastEnemyCol; // P2 exit is high col
  }
}

// Check if stacking is a rescue (moving FROM danger TO safer stack)
function isRescueStack(fromPos,destPos,player,cells){
  if(cells[destPos]*player<=0)return false;
  var dangerFrom=computeDanger(fromPos,player,cells).maxP;
  var dangerTo=computeDanger(destPos,player,cells).maxP;
  return dangerFrom>0.2&&dangerTo<dangerFrom;
}

// Priority evaluator: ahmadV base + priority penalties/bonuses
function priorityEval(cells,player,captures,origCells,soldiers,alloc){
  var base=ahmadV(cells,player,captures);
  var penalty=0;

  // === ANTI-STACKING SAFETY NET ===
  // Strongly penalize any board state with stacks, regardless of how they got there
  for(var i=0;i<32;i++){
    if(cells[i]*player>0){
      var cnt=Math.abs(cells[i]);
      if(cnt>1){
        // Check if this is a rescue stack (soldier came from danger)
        var isRescue=false;
        if(origCells&&soldiers&&alloc){
          for(var si=0;si<soldiers.length;si++){
            if(soldiers[si]===i)continue;
            if(!alloc[si]||!alloc[si].length)continue;
            var fd=computeDanger(soldiers[si],player,origCells).maxP;
            if(fd>0){isRescue=true;break}
          }
        }
        if(!isRescue){
          penalty-=cnt*cnt*20; // quadratic penalty: 2→-80, 3→-180, 4→-320
        }
      }
    }
  }

  // === DANGER-FIRST: penalize leaving endangered soldiers in place ===
  if(origCells&&soldiers&&alloc){
    for(var i=0;i<soldiers.length;i++){
      var origPos=soldiers[i];
      var origDanger=computeDanger(origPos,player,origCells);
      if(origDanger.maxP<=0)continue;

      // Where does this soldier end up?
      var sc2=origCells.slice();
      var finalPos=origPos;
      if(alloc[i]&&alloc[i].length>0){
        for(var vi=0;vi<alloc[i].length;vi++){
          var r=aiSimMove(sc2,finalPos,alloc[i][vi],player);
          finalPos=r.pos;
        }
      }
      var destDng=computeDanger(finalPos,player,cells);
      var cnt=Math.abs(origCells[origPos])||1;

      if(!alloc[i]||alloc[i].length===0){
        // Left endangered soldier in place — penalty proportional to danger and count
        penalty-=origDanger.maxP*cnt*50;
      }else if(destDng.maxP>=origDanger.maxP){
        // Moved but NOT safer — still penalize
        penalty-=origDanger.maxP*cnt*30;
      }else if(destDng.maxP<origDanger.maxP){
        // Moved to safer square — reward
        penalty+=(origDanger.maxP-destDng.maxP)*cnt*40;
      }
    }
  }

  // === ANTI-FORK (suicidal placement in enemy home) ===
  for(var i=0;i<32;i++){
    if(cells[i]*player>0&&isEnm(i,player)){
      if(isSuicidalFork(i,player,cells)){
        penalty-=60*Math.abs(cells[i]);
      }
    }
  }

  // === AMBUSH PREFERENCE (only if enemies exist to ambush) ===
  // Check: are there enemy soldiers on the battlefield or approaching?
  var enemyApproaching=false;
  for(var i=8;i<24;i++){if(cells[i]*player<0){enemyApproaching=true;break}}
  if(!enemyApproaching){
    // Check enemy home — are there soldiers that will come out?
    var ehs=player===1?24:0,ehe=player===1?32:8;
    for(var i=ehs;i<ehe;i++){if(cells[i]*(-player)>0){enemyApproaching=true;break}}
  }
  if(enemyApproaching){
    for(var i=0;i<32;i++){
      if(cells[i]*player>0&&isAmbushPos(i,player)){
        penalty+=Math.abs(cells[i])*10;
      }
    }
  }

  // === BAIT DETECTION: penalize if enemy can reach us with throw of 2 or 3 ===
  if(origCells){
    var myTotal=0,oppTotal=0;
    for(var i=0;i<32;i++){
      if(cells[i]*player>0)myTotal+=Math.abs(cells[i]);
      if(cells[i]*player<0)oppTotal+=Math.abs(cells[i]);
    }
    var endgame=(myTotal<=3||oppTotal<=3);
    var opp=-player;

    for(var i=0;i<32;i++){
      if(cells[i]*player<=0)continue;
      if(isOwn(i,player)||isEnm(i,player))continue;
      var cnt=Math.abs(cells[i]);
      // Was this soldier already here before this move?
      var wasHere=(origCells[i]*player>0);
      if(wasHere)continue; // only penalize NEW exposures
      // Check if any enemy can reach this square with throw of 2 or 3
      var baitFound=false;
      for(var ei=0;ei<32&&!baitFound;ei++){
        if(cells[ei]*opp<=0)continue;
        var oppCnt=Math.abs(cells[ei]);
        for(var d=2;d<=3;d++){
          var dests=moveSteps(ei,d,opp);
          for(var di2=0;di2<dests.length;di2++){
            if(dests[di2]===i){
              if(endgame){
                penalty-=cnt*40;
              }else if(cnt<=oppCnt){
                penalty-=cnt*25;
              }
              baitFound=true;break;
            }
          }
          if(baitFound)break;
        }
      }
    }
  }

  return base+penalty;
}

// Check if an allocation creates any new stacking
// Rejects: any case where the result board has more friendlies on a square than the original
// Exception: exactly one soldier moving from danger to join an existing friendly (rescue)
function allocCreatesStack(alloc,soldiers,player,boardCe){
  // Simulate the full allocation
  var result=simFullAlloc(boardCe,alloc,soldiers,player);
  var rc=result.cells;
  // Check every square: did friendly count increase?
  for(var i=0;i<32;i++){
    var origCount=boardCe[i]*player>0?Math.abs(boardCe[i]):0;
    var newCount=rc[i]*player>0?Math.abs(rc[i]):0;
    if(newCount>1&&newCount>origCount){
      // Stacking detected at position i
      // How many NEW soldiers arrived here?
      var newArrivals=newCount-origCount;
      if(newArrivals>1){
        // Multiple soldiers converged on same square — always reject
        return true;
      }
      // Exactly one new soldier arrived — check if rescue
      if(origCount===0){
        // The square was empty — this is convergence even with 1 arrival
        // (the "existing" soldier also just arrived)
        return true;
      }
      // origCount >= 1, one new soldier joined existing — find who moved here
      var rescueOk=false;
      var toDanger=computeDanger(i,player,boardCe).maxP;
      for(var si=0;si<soldiers.length;si++){
        if(!alloc[si]||!alloc[si].length)continue;
        if(soldiers[si]===i)continue; // was already here
        // Simulate where this soldier lands
        var testPos=soldiers[si];
        for(var vi2=0;vi2<alloc[si].length;vi2++){
          var dts2=moveSteps(testPos,alloc[si][vi2],player);
          if(dts2.length)testPos=dts2[0];
        }
        var fromDanger=computeDanger(soldiers[si],player,boardCe).maxP;
        if(testPos===i){
          // This IS the mover landing at i — allow if it was endangered and dest is safer
          if(fromDanger>0&&toDanger<fromDanger)rescueOk=true;
          break;
        }
        if(fromDanger>0&&toDanger<fromDanger){rescueOk=true;break;}
      }
      if(!rescueOk)return true; // non-rescue stack — reject
    }
  }
  return false;
}

// Priority AI: danger-first greedy allocation with hard stack filtering
function aiPlayPriority(player,vals,sols){
  var moved=false;if(!sols.length)return false;
  var n=sols.length,sn=player===1?1:-1;

  var allAllocs=enumAllocs(vals,n);
  var ba=null,bf=-1e9,allResults=[];
  // Fallback: best allocation even if it stacks (in case ALL options stack)
  var baFallback=null,bfFallback=-1e9;

  function evalAllocPriority(alloc){
    var r=simFullAlloc(ce,alloc,sols,player);
    return{cells:r.cells,score:priorityEval(r.cells,player,r.captures,ce,sols,alloc),captures:r.captures};
  }

  if(allAllocs===null){
    // Sampling mode
    for(var t=0;t<2000;t++){
      var alloc=[];for(var i=0;i<n;i++)alloc[i]=[];
      for(var vi=0;vi<vals.length;vi++)alloc[Math.floor(Math.random()*n)].push(vals[vi]);
      var ev=evalAllocPriority(alloc);
      allResults.push({alloc:alloc,score:ev.score,cells:ev.cells});
      // Track fallback (best regardless of stacking)
      if(ev.score>bfFallback){bfFallback=ev.score;baFallback=alloc}
      // Only accept non-stacking allocations for primary best
      if(!allocCreatesStack(alloc,sols,player,ce)){
        if(ev.score>bf){bf=ev.score;ba=alloc}
      }
    }
  }else{
    // Exhaustive mode
    for(var ai=0;ai<allAllocs.length;ai++){
      var ev=evalAllocPriority(allAllocs[ai]);
      allResults.push({alloc:allAllocs[ai],score:ev.score,cells:ev.cells});
      if(ev.score>bfFallback){bfFallback=ev.score;baFallback=allAllocs[ai]}
      if(!allocCreatesStack(allAllocs[ai],sols,player,ce)){
        if(ev.score>bf){bf=ev.score;ba=allAllocs[ai]}
      }
    }
  }

  // If no non-stacking allocation found, fall back to best overall
  if(!ba)ba=baFallback;

  offData={player:player,soldiers:sols.slice(),vals:vals.slice(),preCe:ce.slice(),count:allResults.length,chosenAlloc:ba};
  if(!ba)return false;

  // Execute best allocation
  for(var i=0;i<n;i++){if(!ba[i].length)continue;var pos=sols[i];
    for(var vi=0;vi<ba[i].length;vi++){
      var val=ba[i][vi];
      if(val===1&&isOwn(pos,player)&&(fa[player]||{})[pos]&&canFree(pos,player)){
        var x=freeSpecific(player,pos);
        var pn2=player===1?'P1':'P2';
        if(x.c>0)addLog('  '+pn2+': freed '+lab(x.o)+'→'+lab(x.n)+' CAPTURED '+x.c+'!','lc');
        else addLog('  '+pn2+': freed '+lab(x.o)+'→'+lab(x.n),'la');
        moved=true;continue;
      }
      var ds=moveSteps(pos,val,player);
      if(!ds.length)continue;
      var ci=0;
      if(ds.length>1){
        var bestFS=-1e9;
        for(var fi=0;fi<ds.length;fi++){
          var tc=ce.slice();var sn2=player===1?1:-1;
          var tot2=Math.abs(tc[pos]),frz2=(fa[player]||{})[pos]||0,m2=tot2-frz2;
          if(m2<=0)continue;var mc2=(val===1&&m2>1)?1:m2;
          tc[pos]-=mc2*sn2;if(tc[ds[fi]]*player<0)tc[ds[fi]]=0;tc[ds[fi]]+=mc2*sn2;
          var fs2=priorityEval(tc,player,0,ce,null,null);
          if(fs2>bestFS){bestFS=fs2;ci=fi}
        }
      }
      var r=doMove(pos,val,player,ci);
      if(r.moved){
        moved=true;
        var pn2=player===1?'P1':'P2';
        if(r.cap>0)addLog('  '+pn2+': '+lab(pos)+'→'+lab(r.np)+' ('+val+') CAPTURED '+r.cap+'!','lc');
        else addLog('  '+pn2+': '+lab(pos)+'→'+lab(r.np)+' ('+val+')','la');
        lm={from:pos,to:r.np};pos=r.np;
      }
    }
  }
  return moved;
}

// =====================================================================
// VSIMPLE AI ENGINE — kills + safe - dangered (brute force)
// Dangered = enemy can reach with throw of 2 or 3
// Same stack filter and anti-fork rules as Priority
// =====================================================================

function isDangered23(pos,owner,cells){
  // Is this battlefield soldier reachable by any opponent with throw of 2 or 3?
  // Dist-2 (63.2%) and dist-3 (57.1%) are most dangerous — tuned for VSimple weights.
  // Fast: track-index arithmetic, no global state dependency.
  if(isOwn(pos,owner))return false;
  if(isEnm(pos,owner))return false;
  var opp=-owner;
  var posIdx=findOnTrack(pos,opp);
  if(posIdx<0)return false;
  for(var i=0;i<32;i++){
    if(cells[i]*opp<=0)continue;
    var oppIdx=findOnTrack(i,opp);
    if(oppIdx<0)continue;
    if(oppIdx+2===posIdx||oppIdx+3===posIdx)return true;
  }
  return false;
}

// Optimized weights from evolutionary search (50% vs GA-Original)
var VS_A=5.00,VS_B=1.00,VS_C=5.09,VS_D=4.89,VS_E=0.79;

function vSimpleEval(cells,player,captures){
  var kills=captures||0;
  var safe=0,dangered=0;
  for(var i=0;i<32;i++){
    if(cells[i]*player<=0)continue;
    var cnt=Math.abs(cells[i]);
    if(isDangered23(i,player,cells)){
      dangered+=cnt;
    }else{
      safe+=cnt;
    }
  }
  var oppAlive=0;
  for(var i=0;i<32;i++){if(cells[i]*player<0)oppAlive+=Math.abs(cells[i])}
  if(oppAlive===0)return 100000;
  var myAlive=safe+dangered;
  if(myAlive===0)return -100000;

  var forkPen=0;
  for(var i=0;i<32;i++){
    if(cells[i]*player>0&&isEnm(i,player)){
      if(isSuicidalFork(i,player,cells)){
        forkPen-=Math.abs(cells[i]);
      }
    }
  }
  var stackPen=0;
  for(var i=0;i<32;i++){
    if(cells[i]*player>0){
      var cnt=Math.abs(cells[i]);
      if(cnt>1)stackPen-=cnt*cnt;
    }
  }

  return VS_A*kills+VS_B*safe-VS_C*dangered+VS_D*forkPen+VS_E*stackPen;
}

function aiPlayVSimple(player,vals,sols){
  var moved=false;if(!sols.length)return false;
  var n=sols.length,sn=player===1?1:-1;
  var allAllocs=enumAllocs(vals,n);
  var ba=null,bf=-1e9,allResults=[];
  var baFallback=null,bfFallback=-1e9;

  function evalAlloc(alloc){
    var r=simFullAlloc(ce,alloc,sols,player);
    return{cells:r.cells,score:vSimpleEval(r.cells,player,r.captures),captures:r.captures};
  }

  if(allAllocs===null){
    for(var t=0;t<2000;t++){
      var alloc=[];for(var i=0;i<n;i++)alloc[i]=[];
      for(var vi=0;vi<vals.length;vi++)alloc[Math.floor(Math.random()*n)].push(vals[vi]);
      var ev=evalAlloc(alloc);
      allResults.push({alloc:alloc,score:ev.score,cells:ev.cells});
      if(ev.score>bfFallback){bfFallback=ev.score;baFallback=alloc}
      // Allow terminal wins and captures to bypass stack filter
      if(ev.score>=100000||ev.captures>0||!allocCreatesStack(alloc,sols,player,ce)){
        if(ev.score>bf){bf=ev.score;ba=alloc}
      }
    }
  }else{
    for(var ai=0;ai<allAllocs.length;ai++){
      var ev=evalAlloc(allAllocs[ai]);
      allResults.push({alloc:allAllocs[ai],score:ev.score,cells:ev.cells});
      if(ev.score>bfFallback){bfFallback=ev.score;baFallback=allAllocs[ai]}
      if(ev.score>=100000||ev.captures>0||!allocCreatesStack(allAllocs[ai],sols,player,ce)){
        if(ev.score>bf){bf=ev.score;ba=allAllocs[ai]}
      }
    }
  }

  if(!ba)ba=baFallback;
  offData={player:player,soldiers:sols.slice(),vals:vals.slice(),preCe:ce.slice(),count:allResults.length};
  if(!ba)return false;

  for(var i=0;i<n;i++){if(!ba[i].length)continue;var pos=sols[i];
    for(var vi=0;vi<ba[i].length;vi++){
      var val=ba[i][vi];
      if(val===1&&isOwn(pos,player)&&(fa[player]||{})[pos]&&canFree(pos,player)){
        var x=freeSpecific(player,pos);
        var pn2=player===1?'P1':'P2';
        if(x.c>0)addLog('  '+pn2+': freed '+lab(x.o)+'→'+lab(x.n)+' CAPTURED '+x.c+'!','lc');
        else addLog('  '+pn2+': freed '+lab(x.o)+'→'+lab(x.n),'la');
        moved=true;continue;
      }
      var ds=moveSteps(pos,val,player);
      if(!ds.length)continue;
      var ci=0;
      if(ds.length>1){
        var bestFS=-1e9;
        for(var fi=0;fi<ds.length;fi++){
          var tc=ce.slice();var sn2=player===1?1:-1;
          var tot2=Math.abs(tc[pos]),frz2=(fa[player]||{})[pos]||0,m2=tot2-frz2;
          if(m2<=0)continue;var mc2=(val===1&&m2>1)?1:m2;
          tc[pos]-=mc2*sn2;if(tc[ds[fi]]*player<0)tc[ds[fi]]=0;tc[ds[fi]]+=mc2*sn2;
          var fs2=vSimpleEval(tc,player,0);
          if(fs2>bestFS){bestFS=fs2;ci=fi}
        }
      }
      var r=doMove(pos,val,player,ci);
      if(r.moved){
        moved=true;
        var pn2=player===1?'P1':'P2';
        if(r.cap>0)addLog('  '+pn2+': '+lab(pos)+'→'+lab(r.np)+' ('+val+') CAPTURED '+r.cap+'!','lc');
        else addLog('  '+pn2+': '+lab(pos)+'→'+lab(r.np)+' ('+val+')','la');
        lm={from:pos,to:r.np};pos=r.np;
      }
    }
  }
  return moved;
}

// =====================================================================
// 2-PHASE AGENT: VSimple filter → MC-data-driven Phase 2 selection
// Phase 1: VSimple scores all, filter by minimum dangered + stack filter
// Phase 2: MC-informed fitness — phase-aware captures, stacking, enemy home
// Data source: 50M Random vs Random games (6.46 billion observations)
// =====================================================================

// Base weights from evolutionary optimization
var P2_HM=2.49,P2_BF=1.63,P2_GP=2.69;
var P2_TW={1:2.59,2:0.07,3:0.15,4:0.12,5:0.80,6:0.70};
var P2_MT=7.00;

// MC-derived: capture boost by phase (early/mid: +3.7%, late: +13.8%)
// Ratio: late captures are 3.7x more valuable
var P2_CB_EARLY=10.0,P2_CB_MID=10.0,P2_CB_LATE=37.0;

// MC-derived: enemy home value scales with material advantage
// When behind: +0.3% to +1.7% → low value
// When ahead: +5.4% to +6.5% → high value
var P2_EH_BASE=4.0,P2_EH_MAT_SCALE=1.5; // EH = BASE + mat * SCALE

// MC-derived: stacking penalty is phase and material dependent
// Early/Mid: always bad (-2.5% to -3.2%)
// Late behind: slightly good (+2.4% to +3.1%)
// Late ahead: very bad (-5.7% to -9.1%)
var P2_GP_EARLY=3.0,P2_GP_MID=2.7;
var P2_GP_LATE_BEHIND=-1.5; // negative = reward stacking when behind
var P2_GP_LATE_EVEN=4.0;
var P2_GP_LATE_AHEAD=8.0;

function getPhase(myT,opT){
  var total=myT+opT;
  if(total>=14)return 0; // early
  if(total>=8)return 1;  // mid
  return 2;              // late
}

function phase2Eval(cells,player,captures){
  var fit=0,myT=0,opT=0;
  var opp=-player,oppTr=getTrack(opp);

  // First pass: count totals for phase detection
  for(var i=0;i<32;i++){
    if(cells[i]*player>0)myT+=Math.abs(cells[i]);
    else if(cells[i]*player<0)opT+=Math.abs(cells[i]);
  }

  var phase=getPhase(myT,opT);
  var mat=myT-opT;

  // Phase-dependent enemy home value
  var ehVal=P2_EH_BASE+mat*P2_EH_MAT_SCALE;
  if(ehVal<1.0)ehVal=1.0; // floor

  // Phase-dependent grouping penalty
  var gpVal;
  if(phase===0)gpVal=P2_GP_EARLY;
  else if(phase===1)gpVal=P2_GP_MID;
  else{
    // Late game: depends on material
    if(mat<=-1)gpVal=P2_GP_LATE_BEHIND;      // behind: stacking ok
    else if(mat===0)gpVal=P2_GP_LATE_EVEN;    // even: moderate penalty
    else gpVal=P2_GP_LATE_AHEAD;              // ahead: spread out
  }

  // Deployment-aware home value: when queue is empty all soldiers are freed
  // and must deploy — staying home contributes nothing. Use 0.5 < P2_BF=1.63.
  var hmVal=(fq[player]&&fq[player].length===0)?0.5:P2_HM;

  // Second pass: compute fitness
  for(var i=0;i<32;i++){
    var val=cells[i];
    if(val*player>0){
      var cnt=Math.abs(val);
      if(isOwn(i,player))fit+=cnt*hmVal;
      else if(isEnm(i,player))fit+=cnt*ehVal;
      else fit+=cnt*P2_BF;
      // Grouping penalty (phase-aware)
      if(cnt>1)fit-=cnt*gpVal;
      // Threat detection
      var mi=-1;
      for(var ti=0;ti<TL;ti++){if(oppTr[ti]===i){mi=ti;break}}
      if(mi>=0){
        for(var d=1;d<=6;d++){
          var bi=mi-d;
          if(bi>=0&&cells[oppTr[bi]]*player<0){
            fit-=P2_TW[d]*Math.abs(cells[oppTr[bi]]);
          }
        }
      }
    }
  }

  // Material advantage
  fit+=mat*P2_MT;

  // Phase-aware capture bonus
  var cap=captures||0;
  if(cap>0){
    var cbVal;
    if(phase===0)cbVal=P2_CB_EARLY;
    else if(phase===1)cbVal=P2_CB_MID;
    else cbVal=P2_CB_LATE;
    fit+=cap*cbVal;
  }

  return fit;
}

function dangerScore(cells,player){
  // Weighted danger score per battlefield position.
  // Includes freed home-row opponent soldiers (released from queue but still in home).
  var opp=-player,total=0.0;
  var oppHomeStart=(opp===1)?0:24,oppHomeEnd=(opp===1)?8:32;
  var oppFa=fa[opp]||{};
  for(var i=0;i<32;i++){
    if(cells[i]*player<=0)continue;
    if(isOwn(i,player)||isEnm(i,player))continue;
    var posIdx=findOnTrack(i,opp);
    if(posIdx<0)continue;
    var cnt=Math.abs(cells[i]),maxP=0.0;
    // Battlefield opponent soldiers
    for(var j=0;j<32;j++){
      if(cells[j]*opp<=0)continue;
      var oppIdx=findOnTrack(j,opp);
      if(oppIdx<0)continue;
      for(var d=0;d<DANGER_DISTS.length;d++){
        var dist=DANGER_DISTS[d];
        if(oppIdx+dist===posIdx){
          var p=DANGER_PROBS[dist]*Math.abs(cells[j]);
          if(p>maxP)maxP=p;
        }
      }
    }
    // Freed home-row opponent soldiers (in home but not frozen)
    for(var j=oppHomeStart;j<oppHomeEnd;j++){
      if(cells[j]*opp<=0)continue;
      var frozenCnt=oppFa[j]||0;
      var freedCnt=Math.abs(cells[j])-frozenCnt;
      if(freedCnt<=0)continue;
      for(var d=0;d<DANGER_DISTS.length;d++){
        var dist=DANGER_DISTS[d];
        var dests=moveSteps(j,dist,opp);
        for(var di=0;di<dests.length;di++){
          if(dests[di]===i){
            var p=DANGER_PROBS[dist]*freedCnt;
            if(p>maxP)maxP=p;
          }
        }
      }
    }
    total+=maxP*cnt;
  }
  return total;
}

function aiPlay2Phase(player,vals,sols){
  var moved=false;if(!sols.length)return false;
  var n=sols.length,sn=player===1?1:-1;
  var allAllocs=enumAllocs(vals,n);
  var candidates=[];

  // === PHASE 1: Evaluate all, compute VSimple + dangered count ===
  // Detect game phase for stack filter
  var myTot=0,opTot=0;
  for(var i=0;i<32;i++){
    if(ce[i]*player>0)myTot+=Math.abs(ce[i]);
    else if(ce[i]*player<0)opTot+=Math.abs(ce[i]);
  }
  var curPhase=getPhase(myTot,opTot);
  var curMat=myTot-opTot;
  // MC insight: allow stacking in late game when behind
  var allowStack=(curPhase===2&&curMat<=-1);

  if(allAllocs===null){
    for(var t=0;t<3000;t++){
      var alloc=[];for(var i=0;i<n;i++)alloc[i]=[];
      for(var vi=0;vi<vals.length;vi++)alloc[Math.floor(Math.random()*n)].push(vals[vi]);
      var r=simFullAlloc(ce,alloc,sols,player);
      var vs=vSimpleEval(r.cells,player,r.captures);
      var dng=dangerScore(r.cells,player);
      // Always include terminal wins (vs>=100000) and max-capture moves regardless of stacking
      if(vs>=100000||allowStack||!allocCreatesStack(alloc,sols,player,ce)){
        candidates.push({alloc:alloc,vsScore:vs,cells:r.cells,captures:r.captures,dangered:dng});
      }else if(r.captures>0){
        // Include capturing moves even if they stack (captures are valuable)
        candidates.push({alloc:alloc,vsScore:vs,cells:r.cells,captures:r.captures,dangered:dng});
      }
    }
  }else{
    for(var ai=0;ai<allAllocs.length;ai++){
      var r=simFullAlloc(ce,allAllocs[ai],sols,player);
      var vs=vSimpleEval(r.cells,player,r.captures);
      var dng=dangerScore(r.cells,player);
      if(vs>=100000||allowStack||!allocCreatesStack(allAllocs[ai],sols,player,ce)){
        candidates.push({alloc:allAllocs[ai],vsScore:vs,cells:r.cells,captures:r.captures,dangered:dng});
      }else if(r.captures>0){
        candidates.push({alloc:allAllocs[ai],vsScore:vs,cells:r.cells,captures:r.captures,dangered:dng});
      }
    }
  }

  // Fallback if all stack
  if(candidates.length===0){
    if(allAllocs===null){
      for(var t=0;t<2000;t++){
        var alloc=[];for(var i=0;i<n;i++)alloc[i]=[];
        for(var vi=0;vi<vals.length;vi++)alloc[Math.floor(Math.random()*n)].push(vals[vi]);
        var r=simFullAlloc(ce,alloc,sols,player);
        var vs=vSimpleEval(r.cells,player,r.captures);
        var dng=dangerScore(r.cells,player);
        candidates.push({alloc:alloc,vsScore:vs,cells:r.cells,captures:r.captures,dangered:dng});
      }
    }else{
      for(var ai=0;ai<allAllocs.length;ai++){
        var r=simFullAlloc(ce,allAllocs[ai],sols,player);
        var vs=vSimpleEval(r.cells,player,r.captures);
        var dng=dangerScore(r.cells,player);
        candidates.push({alloc:allAllocs[ai],vsScore:vs,cells:r.cells,captures:r.captures,dangered:dng});
      }
    }
  }

  // === FILTER: minimum weighted danger score (not binary count) ===
  // dist-2 with 2 enemies = 1.264; dist-4 with 2 enemies = 0.454.
  // Keeps only the safest candidates. Captures allowed +1.0 extra danger units.
  var minDng=Infinity;
  for(var ci=0;ci<candidates.length;ci++){
    if(candidates[ci].dangered<minDng)minDng=candidates[ci].dangered;
  }
  var EPSILON=0.01,CAP_SLACK=1.0;
  var filtered=[];
  for(var ci=0;ci<candidates.length;ci++){
    var c=candidates[ci];
    if(c.dangered<=minDng+EPSILON){
      filtered.push(c);
    }else if(c.dangered<=minDng+CAP_SLACK&&c.captures>0){
      filtered.push(c);
    }
  }
  if(filtered.length===0)filtered=candidates;

  // === Sort by VSimple score, then apply Phase 2 for close candidates ===
  // Threshold: 10% of actual score range, with 0.5 floor (handles zero/negative best)
  filtered.sort(function(a,b){return b.vsScore-a.vsScore});
  var bestVS=filtered[0].vsScore;
  var worstVS=filtered[filtered.length-1].vsScore;
  var scoreRange=Math.abs(bestVS-worstVS);
  var threshold=Math.max(0.5,scoreRange*0.10);
  var close=[];
  for(var ci=0;ci<filtered.length;ci++){
    if(bestVS-filtered[ci].vsScore<=threshold){
      close.push(filtered[ci]);
    }
  }
  if(close.length<=1){
    // VSimple has a clear winner, use it directly
    var ba=filtered[0].alloc;
    var bf=filtered[0].vsScore;
  }else{
    // Phase 2: AhmadV breaks the tie — correct survival prob + attack potential
    var ba=null,bf=-1e9;
    for(var fi=0;fi<close.length;fi++){
      var c=close[fi];
      var p2Score=ahmadV(c.cells,player,c.captures);
      if(p2Score>bf){bf=p2Score;ba=c.alloc}
    }
  }

  offData={player:player,soldiers:sols.slice(),vals:vals.slice(),preCe:ce.slice(),count:candidates.length};
  if(!ba)return false;

  // Execute (fork decisions use VSimple for safety)
  for(var i=0;i<n;i++){if(!ba[i].length)continue;var pos=sols[i];
    for(var vi=0;vi<ba[i].length;vi++){
      var val=ba[i][vi];
      if(val===1&&isOwn(pos,player)&&(fa[player]||{})[pos]&&canFree(pos,player)){
        var x=freeSpecific(player,pos);
        var pn2=player===1?'P1':'P2';
        if(x.c>0)addLog('  '+pn2+': freed '+lab(x.o)+'→'+lab(x.n)+' CAPTURED '+x.c+'!','lc');
        else addLog('  '+pn2+': freed '+lab(x.o)+'→'+lab(x.n),'la');
        moved=true;continue;
      }
      var ds=moveSteps(pos,val,player);
      if(!ds.length)continue;
      var ci=0;
      if(ds.length>1){
        var bestFS=-1e9;
        for(var fi=0;fi<ds.length;fi++){
          var tc=ce.slice();var sn2=player===1?1:-1;
          var tot2=Math.abs(tc[pos]),frz2=(fa[player]||{})[pos]||0,m2=tot2-frz2;
          if(m2<=0)continue;var mc2=(val===1&&m2>1)?1:m2;
          tc[pos]-=mc2*sn2;if(tc[ds[fi]]*player<0)tc[ds[fi]]=0;tc[ds[fi]]+=mc2*sn2;
          var fs2=vSimpleEval(tc,player,0);
          if(fs2>bestFS){bestFS=fs2;ci=fi}
        }
      }
      var r=doMove(pos,val,player,ci);
      if(r.moved){
        moved=true;
        var pn2=player===1?'P1':'P2';
        if(r.cap>0)addLog('  '+pn2+': '+lab(pos)+'→'+lab(r.np)+' ('+val+') CAPTURED '+r.cap+'!','lc');
        else addLog('  '+pn2+': '+lab(pos)+'→'+lab(r.np)+' ('+val+')','la');
        lm={from:pos,to:r.np};pos=r.np;
      }
    }
  }
  return moved;
}


// =====================================================================
// AHMAD AGENT — Expert-derived strategic agent
// Based on analysis of 7 expert games by Ahmad B. Hassanat.
// Decision hierarchy:
//   1. Mate check (current throw + setup for likely throw 2/3)
//   2. Ambush placement (4 zones, correctly mirrored for P1/P2)
//   3. Endgame commit (C1/C2→D-row for P1, B1/B2→A-row for P2)
//   4. AhmadV exhaustive search with stack-only-on-danger filter
// =====================================================================

// Key positions (constant references)
// A-row: 0-7, B-row: 8-15, C-row: 16-23, D-row: 24-31
// B1=8,B2=9,B7=14,B8=15,C1=16,C2=17,C7=22,C8=23,A1=0,A2=1,D7=30,D8=31

// Any opponent soldier on `track` approaching `targetIdx` from behind (dist 1-4)?
function oppApproachingOnTrack(cells,opp,track,targetIdx){
  for(var i=0;i<32;i++){
    if(cells[i]*opp<=0)continue;
    var idx=-1;
    for(var t=0;t<TL;t++){if(track[t]===i){idx=t;break;}}
    if(idx<0)continue;
    for(var d=1;d<=4;d++)if(idx+d===targetIdx)return true;
  }
  return false;
}

// Freed opponent home-row soldiers within 1-4 steps of track entry exit?
// P2 freed in D-row: D8(31)=1step, D7(30)=2, D6(29)=3, D5(28)=4 → exits to C8
// P1 freed in A-row: A1(0)=1step, A2(1)=2, A3(2)=3, A4(3)=4 → exits to B1
function oppFreedOwnHomeApproaching(cells,opp){
  // Trigger when P2 freed soldiers are at D7/D8 (1-2 steps from C8 exit),
  // OR when D7/D8 is the NEXT soldier about to be freed (front of queue).
  // "Front of queue" = rightmost frozen D-row soldier (exit order: D8 first).
  // Same mirror for P1: A1/A2 freed or next-to-free.
  var oppFa=fa[opp]||{};
  if(opp===-1){
    // Check freed D7/D8
    for(var i=30;i<=31;i++){
      if(cells[i]*opp<=0)continue;
      if(Math.abs(cells[i])-(oppFa[i]||0)>0)return true;
    }
    // Check if D7(30) or D8(31) is next-to-be-freed (front of P2 queue)
    // = rightmost frozen P2 D-row soldier
    for(var j=31;j>=24;j--){
      if(cells[j]*opp<=0)continue;
      if((oppFa[j]||0)>0){  // frozen soldier found
        if(j>=30)return true;  // D7(30) or D8(31) is next → imminent
        break;  // front is further in — not imminent
      }
    }
  }else{
    // Check freed A1/A2
    for(var i=0;i<=1;i++){
      if(cells[i]*opp<=0)continue;
      if(Math.abs(cells[i])-(oppFa[i]||0)>0)return true;
    }
    // Check if A1(0) or A2(1) is next-to-be-freed (front of P1 queue)
    // = leftmost frozen P1 A-row soldier (exit order: A1 first)
    for(var j=0;j<=7;j++){
      if(cells[j]*opp<=0)continue;
      if((oppFa[j]||0)>0){  // frozen soldier found
        if(j<=1)return true;  // A1(0) or A2(1) is next → imminent
        break;
      }
    }
  }
  return false;
}

// Freed opponent ENEMY-home soldiers within 1-4 steps of battlefield re-entry?
// P2 freed in A-row (P2 enemy home): A1(0)=1step…A4(3)=4steps → exits to B1
// P1 freed in D-row (P1 enemy home): D8(31)=1step…D5(28)=4steps → exits to C8
function oppFreedEnemyHomeApproaching(cells,opp){
  var oppFa=fa[opp]||{};
  if(opp===-1){
    // P2 freed in A-row approaching exit to B1
    for(var i=0;i<=3;i++){
      if(cells[i]*opp<=0)continue;
      if(Math.abs(cells[i])-(oppFa[i]||0)>0)return true;
    }
  }else{
    // P1 freed in D-row approaching exit to C8
    for(var i=28;i<=31;i++){
      if(cells[i]*opp<=0)continue;
      if(Math.abs(cells[i])-(oppFa[i]||0)>0)return true;
    }
  }
  return false;
}

// Is the game in endgame state (battlefield nearly empty)?
function isAhmadEndgame(cells){
  var n=0;for(var i=8;i<24;i++)if(cells[i]!==0)n+=Math.abs(cells[i]);
  return n<=4;
}

// Check all allocations for immediate win (opp total → 0).
function ahmadMateCheck(allAllocs,sols,player,vals,n){
  var opp=-player;
  if(allAllocs){
    for(var ai=0;ai<allAllocs.length;ai++){
      var r=simFullAlloc(ce,allAllocs[ai],sols,player);
      var rem=0;for(var i=0;i<32;i++)if(r.cells[i]*opp<0)rem+=Math.abs(r.cells[i]);
      if(rem===0)return allAllocs[ai];
    }
  }else{
    for(var t=0;t<5000;t++){
      var alloc=[];for(var i=0;i<n;i++)alloc.push([]);
      for(var vi=0;vi<vals.length;vi++)alloc[Math.floor(Math.random()*n)].push(vals[vi]);
      var r=simFullAlloc(ce,alloc,sols,player);
      var rem=0;for(var i=0;i<32;i++)if(r.cells[i]*opp<0)rem+=Math.abs(r.cells[i]);
      if(rem===0)return alloc;
    }
  }
  return null;
}

// Setup for mate: after this allocation, a throw of 2 or 3 would win.
// Only checked when opp has ≤2 soldiers (most likely scenario for this).
function ahmadSetupMate(allAllocs,sols,player,cells){
  if(!allAllocs)return null;
  var opp=-player;
  var oppTot=0;for(var i=0;i<32;i++)if(cells[i]*opp<0)oppTot+=Math.abs(cells[i]);
  if(oppTot>2)return null;
  var bestAlloc=null,bestScore=-1e9;
  for(var ai=0;ai<allAllocs.length;ai++){
    var r=simFullAlloc(cells,allAllocs[ai],sols,player);
    var rem=0;for(var i=0;i<32;i++)if(r.cells[i]*opp<0)rem+=Math.abs(r.cells[i]);
    if(rem===0)continue; // already mate
    var canMate=false;
    for(var i=0;i<32;i++){
      if(r.cells[i]*player<=0)continue;
      for(var nd=2;nd<=3;nd++){
        var dsts=moveSteps(i,nd,player);
        for(var di=0;di<dsts.length;di++){
          if(r.cells[dsts[di]]*opp<0&&Math.abs(r.cells[dsts[di]])>=rem){canMate=true;break;}
        }
        if(canMate)break;
      }
      if(canMate)break;
    }
    if(canMate){
      var s=ahmadV(r.cells,player,r.captures)+1000;
      if(s>bestScore){bestScore=s;bestAlloc=allAllocs[ai];}
    }
  }
  return bestAlloc;
}

// Find best allocation that places/keeps agent soldier at a target ambush position.
// Rejects allocations that move away from an already-occupied ambush position.
function ahmadFindAmbushAlloc(allAllocs,sols,player,cells,targets){
  if(!allAllocs)return null;
  // bestAlloc:    on-target, no-leave, no-stack  (ideal: hold ambush position)
  // bestFallback: no-stack only                  (advance/retreat ok if no stack)
  // Stacking allocations are excluded from BOTH — never worth the risk.
  var bestAlloc=null,bestScore=-1e9;
  var bestFallback=null,bestFallbackScore=-1e9;
  var n=sols.length,opp=-player;
  for(var ai=0;ai<allAllocs.length;ai++){
    var r=simFullAlloc(cells,allAllocs[ai],sols,player);
    // ── STACK FILTER FIRST — skip stacking allocs entirely ──
    var stackOk=true;
    for(var i=0;i<32;i++){
      if(r.cells[i]*player<=0)continue;
      var oc=(cells[i]*player>0)?Math.abs(cells[i]):0;
      var nc=Math.abs(r.cells[i]);
      if(nc>1&&nc>oc){
        var anyEndangered=false;
        for(var si=0;si<n;si++){
          if(!allAllocs[ai][si]||!allAllocs[ai][si].length)continue;
          if(sols[si]===i)continue;
          if(isDangered23(sols[si],player,cells)){anyEndangered=true;break;}
        }
        if(!anyEndangered){stackOk=false;break;}
      }
    }
    if(!stackOk){
      // Exception: stacking AT an ambush target is intentional
      // (double-power for when prey arrives at the killing zone)
      var stackAtTarget=false;
      for(var i=0;i<32;i++){
        if(r.cells[i]*player<=0)continue;
        var oc2=(cells[i]*player>0)?Math.abs(cells[i]):0;
        if(Math.abs(r.cells[i])>1&&Math.abs(r.cells[i])>oc2){
          for(var ti=0;ti<targets.length;ti++)if(targets[ti]===i){stackAtTarget=true;break;}
          if(stackAtTarget)break;
        }
      }
      if(!stackAtTarget)continue; // non-target stack — excluded
    }
    // Score
    var spread=0;for(var i=0;i<32;i++)if(r.cells[i]*player>0)spread++;
    var dng=dangerScore(r.cells,player);
    var s=ahmadV(r.cells,player,r.captures)+spread*0.05-dng*3.0;
    // bestFallback: any non-stacking allocation regardless of target
    if(s>bestFallbackScore){bestFallbackScore=s;bestFallback=allAllocs[ai];}
    // On-target check
    var onTgt=false;
    for(var ti=0;ti<targets.length;ti++)if(r.cells[targets[ti]]*player>0){onTgt=true;break;}
    if(!onTgt)continue;
    // Leave-target check — allow if making a killing-zone capture
    var leaveTgt=false;
    for(var ti=0;ti<targets.length;ti++){
      if(cells[targets[ti]]*player>0&&r.cells[targets[ti]]*player<=0){
        if(r.captures>0){
          var hitKZ2=false,kz2=[8,9,22,23];
          for(var ki2=0;ki2<kz2.length;ki2++){
            if(cells[kz2[ki2]]*player<0&&r.cells[kz2[ki2]]*player>=0){hitKZ2=true;break;}
          }
          if(!hitKZ2)leaveTgt=true;
        }else{leaveTgt=true;}
        break;
      }
    }
    if(leaveTgt)continue;
    if(s>bestScore){bestScore=s;bestAlloc=allAllocs[ai];}
  }
  return bestAlloc||bestFallback;
}

// Execute chosen allocation. Handles freeing, moves, fork decisions.
function ahmadExecuteAlloc(bestAlloc,sols,player,vals,allocCount){
  var moved=false,n=sols.length,sn=player===1?1:-1;
  var pn2=player===1?'P1':'P2';
  offData={player:player,soldiers:sols.slice(),vals:vals.slice(),preCe:ce.slice(),count:allocCount||0};
  for(var i=0;i<n;i++){
    if(!bestAlloc[i]||!bestAlloc[i].length)continue;
    var pos=sols[i];
    for(var vi=0;vi<bestAlloc[i].length;vi++){
      var val=bestAlloc[i][vi];
      // Freeing check
      if(val===1&&isOwn(pos,player)&&(fa[player]||{})[pos]&&canFree(pos,player)){
        var x=freeSpecific(player,pos);
        if(x.c>0)addLog('  '+pn2+': freed '+lab(x.o)+'→'+lab(x.n)+' CAPTURED '+x.c+'!','lc');
        else addLog('  '+pn2+': freed '+lab(x.o)+'→'+lab(x.n),'la');
        moved=true;continue;
      }
      var ds=moveSteps(pos,val,player);
      if(!ds.length)continue;
      var ci=0;
      // Fork decision: use AhmadV to pick best destination
      if(ds.length>1){
        var bestFS=-1e9;
        for(var fi=0;fi<ds.length;fi++){
          var tc=ce.slice();
          var tot=Math.abs(tc[pos]),frz=(fa[player]||{})[pos]||0,m=tot-frz;
          if(m<=0)m=1;
          var mc=(val===1&&m>1)?1:m;
          tc[pos]-=mc*sn;
          if(tc[ds[fi]]*player<0)tc[ds[fi]]=0;
          tc[ds[fi]]+=mc*sn;
          var fs=ahmadV(tc,player,0);
          if(fs>bestFS){bestFS=fs;ci=fi;}
        }
      }
      var r=doMove(pos,val,player,ci);
      if(r.moved){
        moved=true;
        if(r.cap>0)addLog('  '+pn2+': '+lab(pos)+'→'+lab(r.np)+' ('+val+') CAPTURED '+r.cap+'!','lc');
        else addLog('  '+pn2+': '+lab(pos)+'→'+lab(r.np)+' ('+val+')','la');
        lm={from:pos,to:r.np};pos=r.np;
      }
    }
  }
  return moved;
}

// Main Ahmad Agent function
function aiPlayAhmad(player,vals,sols){
  if(!sols.length)return false;
  var n=sols.length,opp=-player;
  var p1tr=getTrack(1),p2tr=getTrack(-1);
  var allAllocs=enumAllocs(vals,n);

  // ============================================================
  // RULE 0: MAXIMIZE KILLING — 2+ captures overrides everything
  // If any allocation captures 2 or more enemies this turn, do it.
  // No danger penalty, no stack filter, no ambush constraints.
  // "Worth risking" — raw aggression always beats caution here.
  // ============================================================
  if(allAllocs){
    var maxCap=0;
    for(var ai=0;ai<allAllocs.length;ai++){
      var r=simFullAlloc(ce,allAllocs[ai],sols,player);
      if(r.captures>maxCap)maxCap=r.captures;
    }
    if(maxCap>=2){
      var bestKill=null,bestKillScore=-1e9;
      for(var ai=0;ai<allAllocs.length;ai++){
        var r=simFullAlloc(ce,allAllocs[ai],sols,player);
        if(r.captures<maxCap)continue;
        var s=ahmadV(r.cells,player,r.captures);
        if(s>bestKillScore){bestKillScore=s;bestKill=allAllocs[ai];}
      }
      if(bestKill)return ahmadExecuteAlloc(bestKill,sols,player,vals,allAllocs.length);
    }
  }

  // ============================================================
  // STEP 1: MATE CHECK
  // ============================================================
  var mateAlloc=ahmadMateCheck(allAllocs,sols,player,vals,n);
  if(mateAlloc)return ahmadExecuteAlloc(mateAlloc,sols,player,vals,allAllocs?allAllocs.length:5000);

  // Setup for next-throw mate (throw 2 or 3 would finish it)
  var oppTot=0;for(var i=0;i<32;i++)if(ce[i]*opp<0)oppTot+=Math.abs(ce[i]);
  if(oppTot<=2){
    var setupAlloc=ahmadSetupMate(allAllocs,sols,player,ce);
    if(setupAlloc)return ahmadExecuteAlloc(setupAlloc,sols,player,vals,allAllocs?allAllocs.length:0);
  }

  // ============================================================
  // STEP 1.5: KILLING ZONE STRIKE
  // If an enemy is ALREADY sitting in a killing zone (B1/B2/C7/C8)
  // and we can reach them this turn — STRIKE. Never wait when the
  // prey has arrived. This overrides the "stay in ambush" logic.
  // Killing zones: B1(8), B2(9), C7(22), C8(23) for both players.
  // ============================================================
  var KILL_ZONES=[8,9,22,23];
  var enemyInKZ=false;
  for(var ki=0;ki<KILL_ZONES.length;ki++)if(ce[KILL_ZONES[ki]]*player<0){enemyInKZ=true;break;}
  if(enemyInKZ&&allAllocs){
    var bestKZ=null,bestKZScore=-1e9;
    for(var ai=0;ai<allAllocs.length;ai++){
      var r=simFullAlloc(ce,allAllocs[ai],sols,player);
      if(r.captures<=0)continue;
      // Confirm capture happened AT a killing zone
      var hitKZ=false;
      for(var ki=0;ki<KILL_ZONES.length;ki++){
        if(ce[KILL_ZONES[ki]]*player<0&&r.cells[KILL_ZONES[ki]]*player>=0){hitKZ=true;break;}
      }
      if(!hitKZ)continue;
      var spread=0;for(var i=0;i<32;i++)if(r.cells[i]*player>0)spread++;
      var dng=dangerScore(r.cells,player);
      var s=ahmadV(r.cells,player,r.captures)+spread*0.05-dng*3.0;
      if(s>bestKZScore){bestKZScore=s;bestKZ=allAllocs[ai];}
    }
    if(bestKZ)return ahmadExecuteAlloc(bestKZ,sols,player,vals,allAllocs.length);
  }

  // ============================================================
  // STEP 2: AMBUSH CHECK
  // P1 ambushes:
  //   1(primary): A1/A2 → kills P2 approaching B1/B2 on P2_TRACK (C1-C4)
  //   2: B7/B8 → kills P2 freed in D-row approaching C8 (D5-D8)
  //   3(endgame): D7/D8 in enemy home → kills P2 cycling to C8 on P1_TRACK (B5-B8)
  //   4(endgame): C1/C2 → kills P2 freed in A-row approaching B1 exit (A1-A4)
  // P2 ambushes (mirrored):
  //   1(primary): D8/D7 → kills P1 approaching C8 on P1_TRACK (B5-B8)
  //   2: C1/C2 → kills P1 freed in A-row approaching B1 exit (A1-A4)
  //   3(endgame): A1/A2 in enemy home → kills P1 cycling to B1 on P2_TRACK (C1-C4)
  //   4(endgame): B7/B8 → kills P1 freed in D-row approaching C8 exit (D5-D8)
  // ============================================================
  var eg=isAhmadEndgame(ce);
  var ambAlloc=null;

  if(player===1){
    // Ambush 1: A1(0)/A2(1) — P2 approaching B1(P2T idx8) or B2(P2T idx9) on P2_TRACK
    if(!ambAlloc){
      if(oppApproachingOnTrack(ce,opp,p2tr,8)||oppApproachingOnTrack(ce,opp,p2tr,9))
        ambAlloc=ahmadFindAmbushAlloc(allAllocs,sols,player,ce,[0,1]);
    }
    // Ambush 2: B7(14)/B8(15) — P2 freed in D-row (D5-D8) approaching C8
    if(!ambAlloc){
      if(oppFreedOwnHomeApproaching(ce,opp))
        ambAlloc=ahmadFindAmbushAlloc(allAllocs,sols,player,ce,[14,15]);
    }
    // Ambush 3 (endgame): D7(30)/D8(31) — P2 on battlefield approaching C8 on P1_TRACK (B5-B8)
    // P1_TRACK: C8=idx8. P2 at B5(12)=idx4, B6(13)=idx5, B7(14)=idx6, B8(15)=idx7.
    if(!ambAlloc&&eg){
      var p1inD=false;for(var i=24;i<32;i++)if(ce[i]*player>0){p1inD=true;break;}
      if(p1inD&&oppApproachingOnTrack(ce,opp,p1tr,8))
        ambAlloc=ahmadFindAmbushAlloc(allAllocs,sols,player,ce,[30,31]);
    }
    // Ambush 4 (endgame): C1(16)/C2(17) — P2 freed in A-row (A1-A4) approaching B1 exit
    if(!ambAlloc&&eg){
      if(oppFreedEnemyHomeApproaching(ce,opp))
        ambAlloc=ahmadFindAmbushAlloc(allAllocs,sols,player,ce,[16,17]);
    }
  }else{
    // P2 as agent (mirrored)
    // Ambush 1: D8(31)/D7(30) — P1 approaching C8 on P1_TRACK from B-side (B5-B8)
    // P1_TRACK: C8=23 at idx8. P1 at B5(12)=idx4..B8(15)=idx7.
    if(!ambAlloc){
      if(oppApproachingOnTrack(ce,opp,p1tr,8))
        ambAlloc=ahmadFindAmbushAlloc(allAllocs,sols,player,ce,[31,30]);
    }
    // Ambush 2: C1(16)/C2(17) — P1 freed in A-row (A1-A4) approaching B1 exit
    if(!ambAlloc){
      if(oppFreedOwnHomeApproaching(ce,opp))
        ambAlloc=ahmadFindAmbushAlloc(allAllocs,sols,player,ce,[16,17]);
    }
    // Ambush 3 (endgame): A1(0)/A2(1) in enemy home — P1 on P2_TRACK approaching B1 (C1-C4)
    // P2_TRACK: B1=8 at idx8. P1 at C4(19)=idx4, C3(18)=idx5, C2(17)=idx6, C1(16)=idx7.
    if(!ambAlloc&&eg){
      var p2inA=false;for(var i=0;i<8;i++)if(ce[i]*player>0){p2inA=true;break;}
      if(p2inA&&oppApproachingOnTrack(ce,opp,p2tr,8))
        ambAlloc=ahmadFindAmbushAlloc(allAllocs,sols,player,ce,[0,1]);
    }
    // Ambush 4 (endgame): B7(14)/B8(15) — P1 freed in D-row (D5-D8) approaching C8 exit
    if(!ambAlloc&&eg){
      if(oppFreedEnemyHomeApproaching(ce,opp))
        ambAlloc=ahmadFindAmbushAlloc(allAllocs,sols,player,ce,[14,15]);
    }
  }
  if(ambAlloc)return ahmadExecuteAlloc(ambAlloc,sols,player,vals,allAllocs?allAllocs.length:0);

  // ============================================================
  // STEP 3: ENDGAME COMMIT
  // P1: soldier at C1/C2 + allFreed → enter D-row enemy home
  // P2: soldier at B1/B2 + allFreed → enter A-row enemy home
  // ============================================================
  if(allFreed(player)&&allAllocs){
    var cPos=(player===1)?[16,17]:[8,9];  // C1/C2 or B1/B2
    var ehs=(player===1)?24:0, ehe=(player===1)?32:8;
    var hasCPos=false;
    for(var ci=0;ci<cPos.length;ci++)if(ce[cPos[ci]]*player>0){hasCPos=true;break;}
    if(hasCPos){
      for(var ai=0;ai<allAllocs.length;ai++){
        var r=simFullAlloc(ce,allAllocs[ai],sols,player);
        for(var i=ehs;i<ehe;i++){
          if(r.cells[i]*player>0&&(ce[i]*player<=0||Math.abs(r.cells[i])>Math.abs(ce[i]))){
            return ahmadExecuteAlloc(allAllocs[ai],sols,player,vals,allAllocs.length);
          }
        }
      }
    }
  }

  // ============================================================
  // STEP 4: AHMADV EXHAUSTIVE SEARCH WITH STACK-ONLY-ON-DANGER FILTER
  // Stack rule: only allow creating a stack if at least one MOVER
  //             was endangered (isDangered23=true) at its origin.
  //             This implements "stack only on danger, spread otherwise."
  // Unstack: handled implicitly — AhmadV rewards forward progress,
  //          and a small spread bonus encourages splitting stacks.
  // ============================================================
  var bestAlloc=null,bestScore=-1e9;
  var bestFallback=null,bestFallbackScore=-1e9;

  if(allAllocs){
    for(var ai=0;ai<allAllocs.length;ai++){
      var r=simFullAlloc(ce,allAllocs[ai],sols,player);
      // Spread bonus + danger penalty
      var spread=0;for(var i=0;i<32;i++)if(r.cells[i]*player>0)spread++;
      var dng=dangerScore(r.cells,player);
      var s=ahmadV(r.cells,player,r.captures)+spread*0.05-dng*3.0;
      if(s>bestFallbackScore){bestFallbackScore=s;bestFallback=allAllocs[ai];}
      // Stack filter: reject if new non-rescue stack created
      var stackOk=true;
      for(var i=0;i<32;i++){
        if(r.cells[i]*player<=0)continue;
        var oc=ce[i]*player>0?Math.abs(ce[i]):0;
        var nc=Math.abs(r.cells[i]);
        // New stack: more soldiers here than before, and more than 1
        if(nc>1&&nc>oc){
          // Check if any MOVER was endangered at its original position
          var anyEndangered=false;
          for(var si=0;si<n;si++){
            if(!allAllocs[ai][si]||!allAllocs[ai][si].length)continue;
            if(sols[si]===i)continue; // soldier was already at i (stays, doesn't create stack)
            if(isDangered23(sols[si],player,ce)){anyEndangered=true;break;}
          }
          if(!anyEndangered){stackOk=false;break;}
        }
      }
      if(stackOk&&s>bestScore){bestScore=s;bestAlloc=allAllocs[ai];}
    }
  }else{
    // Sampling mode (very large combo space — >50000 allocations)
    for(var t=0;t<50000;t++){
      var alloc=[];for(var i=0;i<n;i++)alloc.push([]);
      for(var vi=0;vi<vals.length;vi++)alloc[Math.floor(Math.random()*n)].push(vals[vi]);
      var r=simFullAlloc(ce,alloc,sols,player);
      var spread=0;for(var i=0;i<32;i++)if(r.cells[i]*player>0)spread++;
      var dng=dangerScore(r.cells,player);
      var s=ahmadV(r.cells,player,r.captures)+spread*0.05-dng*3.0;
      if(s>bestFallbackScore){bestFallbackScore=s;bestFallback=alloc;}
      if(s>bestScore){bestScore=s;bestAlloc=alloc;}
    }
  }

  var chosen=bestAlloc||bestFallback;
  if(!chosen)return false;
  return ahmadExecuteAlloc(chosen,sols,player,vals,allAllocs?allAllocs.length:50000);
}
