// PSA AGENT — phase-aware tactical agent with explicit fork rules
// Conditional rules + fuzzy thresholds + biased allocation generation.
// =====================================================================

function psaWeightedRandom(weights){
  var total=0;for(var i=0;i<weights.length;i++)total+=weights[i];
  if(total<=0)return Math.floor(Math.random()*weights.length);
  var r=Math.random()*total,cum=0;
  for(var i=0;i<weights.length;i++){cum+=weights[i];if(r<cum)return i}
  return weights.length-1;
}

// Track-distance from a battlefield pos to the last cell of my loop
function psaDistToEnemyHomeEntry(pos,player){
  var idx=findOnTrack(pos,player);
  if(idx<0)return 99;
  return TL-1-idx;
}

// Hiding-safety oracle: is sitting at homePos in enemy home safe?
// "Safe" = I'm BEHIND the frontmost freed enemy soldier (they've already moved
// past me and can't easily come back). P1 sits in P2's home (24-31); P2 frees
// from low→high col, exits at col 31→23, so P2's "front" = highest freed col.
// P2 sits in P1's home (0-7); P1 frees high→low col, exits at col 0→8, so
// P1's "front" = lowest freed col.
function psaIsHomeHidingSafe(homePos,player,cells){
  if(!isEnm(homePos,player))return false;
  var opp=-player;
  var oppHomeStart=(opp===1)?0:24;
  var oppHomeEnd=(opp===1)?8:32;
  var oppFa=fa[opp]||{};
  var myCol=homePos%8;
  var sentinel=(opp===1)?-1:8;
  var lastFreedCol=sentinel;
  for(var i=oppHomeStart;i<oppHomeEnd;i++){
    if(cells[i]*opp>0){
      var frozen=oppFa[i]||0;
      var total=Math.abs(cells[i]);
      var freed=total-frozen;
      if(freed>0){
        var col=i%8;
        if(opp===1){ // P1's home: front = lowest col
          if(lastFreedCol===sentinel||col<lastFreedCol)lastFreedCol=col;
        }else{ // P2's home: front = highest col
          if(lastFreedCol===sentinel||col>lastFreedCol)lastFreedCol=col;
        }
      }
    }
  }
  if(lastFreedCol===sentinel)return true; // no freed enemies in their home → trivially safe
  if(opp===1)return myCol>lastFreedCol; // I'm behind P1's freed → safe
  return myCol<lastFreedCol;            // I'm behind P2's freed → safe
}

// How many frozen enemies in their home have my destHome BLOCKING their freeing path?
// (Enemy frees toward exit; if my destHome lies on that path, my presence blocks/captures.)
function psaCountEnemyHomeThreat(destHome,player,cells){
  if(!isEnm(destHome,player))return 0;
  var opp=-player;
  var oppHomeStart=(opp===1)?0:24;
  var oppHomeEnd=(opp===1)?8:32;
  var oppFa=fa[opp]||{};
  var myCol=destHome%8;
  var count=0;
  for(var i=oppHomeStart;i<oppHomeEnd;i++){
    if(cells[i]*opp>0&&(oppFa[i]||0)>0){
      var col=i%8;
      if(opp===1){ // P1 frees col → col-1; freeing path passes cols < col
        if(myCol<col)count++;
      }else{ // P2 frees col → col+1; freeing path passes cols > col
        if(myCol>col)count++;
      }
    }
  }
  return count;
}

// My ambush threats: soldiers in canonical ambush squares + soldiers safely
// hidden behind the train in enemy home.
function psaCountAmbushThreats(cells,player){
  var ambArr=player===1?P1_AMBUSH:P2_AMBUSH;
  var count=0;
  for(var i=0;i<ambArr.length;i++){
    if(cells[ambArr[i]]*player>0)count++;
  }
  var oppHomeStart=(player===1)?24:0;
  var oppHomeEnd=(player===1)?32:8;
  for(var i=oppHomeStart;i<oppHomeEnd;i++){
    if(cells[i]*player>0&&psaIsHomeHidingSafe(i,player,cells))count++;
  }
  return count;
}

// Phase detection
function getPsaPhase(cells,player){
  var myTot=0,opTot=0,bfTot=0;
  for(var i=0;i<32;i++){
    if(cells[i]*player>0)myTot+=Math.abs(cells[i]);
    else if(cells[i]*player<0)opTot+=Math.abs(cells[i]);
    if(i>=8&&i<24&&cells[i]!==0)bfTot+=Math.abs(cells[i]);
  }
  if(myTot<=3||opTot<=3)return 'endgame';
  if(myTot>=7&&opTot>=7&&bfTot<=4)return 'opening';
  if(myTot>=5&&opTot>=5&&bfTot<=8)return 'development';
  return 'midgame';
}

// Fork oracle — 4 prioritized rules. Returns chosen destination cell.
function psaForkDecision(pos,val,player,cells,destLoop,destHome){
  // Rule 4 (highest): captures
  var capLoop=(cells[destLoop]*player<0)?Math.abs(cells[destLoop]):0;
  var capHome=(cells[destHome]*player<0)?Math.abs(cells[destHome]):0;
  if(capHome>0&&capLoop===0)return destHome;
  if(capLoop>0&&capHome===0)return destLoop;
  if(capHome>0&&capLoop>0)return (capHome>=capLoop)?destHome:destLoop;

  // Rule 2: lone soldier → behind-the-train ambush
  var myActive=0;
  for(var i=0;i<32;i++)if(cells[i]*player>0)myActive++;
  if(myActive===1)return destHome;

  // Rule 1: in danger → hide, but only if home destination is safe
  var dng=computeDanger(pos,player,cells).maxP;
  if(dng>0.25){
    if(psaIsHomeHidingSafe(destHome,player,cells))return destHome;
    return destLoop;
  }

  // Default: phase-aware
  var phase=getPsaPhase(cells,player);
  if(phase==='endgame'&&myActive<=2)return destHome;
  if(phase==='opening')return destLoop;

  // Midgame: tempo check
  var homeTempo=psaCountEnemyHomeThreat(destHome,player,cells);
  return (homeTempo>0)?destHome:destLoop;
}

// PSA evaluator: phase-dependent, context-aware
function psaEvaluate(cells,player,captures,origCells,soldiers,alloc,vals){
  var myTot=0,opTot=0,myBF=0,opBF=0;
  for(var i=0;i<32;i++){
    if(cells[i]*player>0){myTot+=Math.abs(cells[i]);if(i>=8&&i<24)myBF++}
    else if(cells[i]*player<0){opTot+=Math.abs(cells[i]);if(i>=8&&i<24)opBF++}
  }
  if(opTot===0)return 100000+captures*100;
  if(myTot===0)return -100000;

  var phase=getPsaPhase(cells,player);
  var mat=myTot-opTot;
  var score=mat*15;

  if(captures>0){
    if(phase==='endgame')score+=captures*captures*50;
    else if(phase==='opening')score+=captures*20;
    else score+=captures*30;
  }

  for(var i=0;i<32;i++){
    if(cells[i]*player<=0)continue;
    var cnt=Math.abs(cells[i]);
    if(isOwn(i,player)){
      var frozen=(fa[player]||{})[i]||0;
      var freed=cnt-frozen;
      if(frozen>0)score-=frozen*2;
      if(freed>0)score+=freed*3;
    }else if(isEnm(i,player)){
      if(psaIsHomeHidingSafe(i,player,cells))score+=cnt*8;
      else score-=cnt*15;
      if(myTot===1)score+=25;
    }else{
      var col=i%8;
      if(col>=3&&col<=4)score+=cnt*2;
      var dng=computeDanger(i,player,cells).maxP;
      score-=dng*dng*cnt*10;
      var entryDist=psaDistToEnemyHomeEntry(i,player);
      if(opBF>0&&entryDist<=3)score+=cnt*4;
    }
  }

  // Stacking: rescue-aware, phase-scaled
  for(var i=0;i<32;i++){
    if(cells[i]*player<=0)continue;
    var cnt=Math.abs(cells[i]);
    if(cnt<=1)continue;
    var origCnt=(origCells[i]*player>0)?Math.abs(origCells[i]):0;
    if(cnt>origCnt){
      var isRescue=false;
      for(var si=0;si<soldiers.length;si++){
        if(!alloc[si]||!alloc[si].length)continue;
        if(soldiers[si]===i)continue;
        var fromDng=computeDanger(soldiers[si],player,origCells).maxP;
        var toDng=computeDanger(i,player,cells).maxP;
        if(fromDng>0.3&&toDng<fromDng){isRescue=true;break}
      }
      if(!isRescue){
        if(phase==='endgame')score-=cnt*2;
        else score-=cnt*cnt*8;
      }
    }
  }

  var myFrozen=fq[player]?fq[player].length:0;
  if(myFrozen===0&&phase!=='endgame')score+=10;

  score+=psaCountAmbushThreats(cells,player)*12;

  return score;
}

// Strategically biased allocation generation
function generatePsaAllocs(vals,sols,player,maxSamples){
  var n=sols.length,allocs=[];

  // (a) All-to-one: each soldier as concentrated target
  for(var i=0;i<n;i++){
    var a=[];for(var j=0;j<n;j++)a.push([]);
    for(var v=0;v<vals.length;v++)a[i].push(vals[v]);
    allocs.push(a);
  }

  // (b) Spread: one value per soldier (if feasible)
  if(vals.length<=n){
    var a=[];for(var j=0;j<n;j++)a.push([]);
    for(var v=0;v<vals.length;v++)a[v].push(vals[v]);
    allocs.push(a);
  }

  // (c) Free-first: route 1s to early soldiers (frozen, if any)
  var hasOnes=false;
  for(var v=0;v<vals.length;v++)if(vals[v]===1){hasOnes=true;break}
  if(hasOnes&&n>1){
    var a=[];for(var j=0;j<n;j++)a.push([]);
    var fi=0;
    for(var v=0;v<vals.length;v++){
      if(vals[v]===1&&fi<n)a[fi++].push(vals[v]);
      else a[Math.min(fi,n-1)].push(vals[v]);
    }
    allocs.push(a);
  }

  // (d) Biased random: weight by danger + nearby enemies
  var safety=0;
  while(allocs.length<maxSamples&&safety<maxSamples*3){
    safety++;
    var a=[];for(var j=0;j<n;j++)a.push([]);
    var failed=false;
    for(var v=0;v<vals.length;v++){
      var weights=[];
      for(var pi=0;pi<sols.length;pi++){
        var p=sols[pi];
        if(isFrozenAt(p,player)&&vals[v]!==1){weights.push(0);continue}
        var dng=computeDanger(p,player,ce).maxP;
        var hasEnemyNear=0;
        for(var d=1;d<=4;d++){
          var ds=moveSteps(p,d,player);
          for(var di=0;di<ds.length;di++){
            if(ce[ds[di]]*player<0){hasEnemyNear=1;break}
          }
          if(hasEnemyNear)break;
        }
        weights.push(1+dng*2+hasEnemyNear*3);
      }
      var total=0;for(var wi=0;wi<weights.length;wi++)total+=weights[wi];
      if(total<=0){failed=true;break}
      var idx=psaWeightedRandom(weights);
      a[idx].push(vals[v]);
    }
    if(!failed)allocs.push(a);
  }

  return allocs;
}

// PSA executor: applies psaForkDecision at each fork (overrides probEval default)
function psaExecuteAlloc(bestAlloc,sols,player,vals,allocCount){
  var moved=false,n=sols.length,sn=player===1?1:-1;
  var pn2=player===1?'P1':'P2';
  offData={player:player,soldiers:sols.slice(),vals:vals.slice(),preCe:ce.slice(),count:allocCount||0};
  for(var i=0;i<n;i++){
    if(!bestAlloc[i]||!bestAlloc[i].length)continue;
    var pos=sols[i];
    for(var vi=0;vi<bestAlloc[i].length;vi++){
      var val=bestAlloc[i][vi];
      if(val===1&&isOwn(pos,player)&&(fa[player]||{})[pos]&&canFree(pos,player)){
        var x=freeSpecific(player,pos);
        if(x.c>0)addLog('  '+pn2+': freed '+lab(x.o)+'→'+lab(x.n)+' CAPTURED '+x.c+'!','lc');
        else addLog('  '+pn2+': freed '+lab(x.o)+'→'+lab(x.n),'la');
        moved=true;continue;
      }
      var ds=moveSteps(pos,val,player);
      if(!ds.length)continue;
      var ci=0;
      if(ds.length>1){
        var pick=psaForkDecision(pos,val,player,ce,ds[0],ds[1]);
        ci=(pick===ds[1])?1:0;
      }
      var r=doMove(pos,val,player,ci);
      if(r.moved){
        moved=true;
        if(r.cap>0)addLog('  '+pn2+': '+lab(pos)+'→'+lab(r.np)+' ('+val+') CAPTURED '+r.cap+'!','lc');
        else addLog('  '+pn2+': '+lab(pos)+'→'+lab(r.np)+' ('+val+')','la');
        lm={from:pos,to:r.np};pos=r.np;
      }
    }
  }
  return moved;
}

// Main PSA play
function aiPlayPsa(player,vals,sols){
  if(!sols.length)return false;
  var candidates=generatePsaAllocs(vals,sols,player,2000);
  var bestAlloc=null,bestScore=-1e9;
  for(var ci=0;ci<candidates.length;ci++){
    var alloc=candidates[ci];
    var sim=simFullAlloc(ce,alloc,sols,player);
    var score=psaEvaluate(sim.cells,player,sim.captures,ce,sols,alloc,vals);
    if(score>bestScore){bestScore=score;bestAlloc=alloc}
  }
  if(!bestAlloc)return false;
  return psaExecuteAlloc(bestAlloc,sols,player,vals,candidates.length);
}

// =====================================================================
// TLA / TLA-S — Tab Lookahead Agent family (from Hassanat 2026 paper)
//
// "Lite" version for browser playability. Compared to the Python version:
//   - 80 self-candidates (paper: 200)
//   - 3 opponent dice sequences (paper: 5)
//   - 8 opponent candidates per sequence (paper: 15)
// Strength loss vs paper-spec TLA-S is ~3-5pp; still beats other agents.
//
// TLA-S layers the autopsy fix on top of TLA: replaces the implicit
// stacking-aversion of ahmadV with a gentle linear penalty that lets
// the agent stack when warranted (the paper's central finding).
// =====================================================================

// Top-3 opponent dice sequences by probability mass (~71% of all turns)
var TLA_OPP_SEQS = [
  {seq:[2],    p:6/16},  // 0.375
  {seq:[3],    p:4/16},  // 0.250
  {seq:[1,2],  p:(4/16)*(6/16)}  // 0.094
];

// Stacking penalty for TLA-S: gentle linear -3*cnt for any new stack
// of size >= 2, computed as a delta from the pre-move board. Mirrors
// the FitnessEvaluator-style flat term that won the autopsy.
function tlaStackingDelta(newCells, origCells, player){
  var penalty = 0;
  for(var i=0; i<SZ; i++){
    if(newCells[i]*player <= 0) continue;
    var cnt = Math.abs(newCells[i]);
    if(cnt < 2) continue;
    var origCnt = (origCells[i]*player > 0) ? Math.abs(origCells[i]) : 0;
    if(cnt > origCnt) penalty -= cnt * 3.0;
  }
  return penalty;
}

// The PRE-FIX quadratic stacking term from LookEvaluator: every newly created
// stack of size c costs c^2 * 8 unless the move is a "rescue" (a soldier
// leaving real danger for a safer square).
//
// NOT EXPOSED IN THE UI, deliberately. We built it so the autopsy of Section
// VII could be replayed in the browser, then measured it: over full games this
// agent never ends a turn holding a stack -- but neither does TLA-S, whose
// repaired flat -3c term is supposed to permit stacking. In the Python engine
// the two are far apart; in this build the score scale makes even the flat
// penalty effectively absolute, so a "TLE-Q" option would not demonstrate the
// contrast its name promises. Shipping it would mislead. The function is kept
// because the replication package's Python autopsy is the authoritative
// version of this experiment (tab_look.py, LOOK-A3 vs LOOK-my-eval); wire this
// back into the dropdown only after the web evaluator's scale is matched to
// the engine's and the contrast is re-measured.
//
// Note: the exemption needs a source square, which a cells-diff does not give
// directly. We reconstruct it as "the most dangerous square this player
// vacated", which reproduces the rule's behaviour on ordinary convergence.
function tleStackingDelta(newCells, origCells, player){
  var penalty = 0, i;
  var maxSrcDanger = 0;
  for(i=0; i<SZ; i++){
    var wasMine = (origCells[i]*player > 0) ? Math.abs(origCells[i]) : 0;
    var nowMine = (newCells[i]*player > 0) ? Math.abs(newCells[i]) : 0;
    if(wasMine > nowMine){
      var d = computeDanger(i, player, origCells).maxP;
      if(d > maxSrcDanger) maxSrcDanger = d;
    }
  }
  for(i=0; i<SZ; i++){
    if(newCells[i]*player <= 0) continue;
    var cnt = Math.abs(newCells[i]);
    if(cnt < 2) continue;
    var origCnt = (origCells[i]*player > 0) ? Math.abs(origCells[i]) : 0;
    if(cnt <= origCnt) continue;
    var dstDanger = computeDanger(i, player, origCells).maxP;
    if(maxSrcDanger > 0.3 && dstDanger < maxSrcDanger) continue;  // rescue
    penalty -= cnt * cnt * 8.0;
  }
  return penalty;
}

// Biased allocation generation. Seeds with structural patterns then fills
// with weighted-random draws (danger-proportional + enemy-proximity).
function tlaBiasedAllocs(vals, sols, player, nTotal){
  var n = sols.length, allocs = [];

  // (a) All-to-one for each soldier
  for(var i=0; i<n; i++){
    var a = []; for(var j=0; j<n; j++) a.push([]);
    for(var v=0; v<vals.length; v++) a[i].push(vals[v]);
    allocs.push(a);
  }

  // (b) Spread (one value per soldier, if feasible)
  if(vals.length <= n){
    var a = []; for(var j=0; j<n; j++) a.push([]);
    for(var v=0; v<vals.length; v++) a[v].push(vals[v]);
    allocs.push(a);
  }

  // (c) Free-first: route 1s to early soldiers
  var hasOnes = vals.indexOf(1) >= 0;
  if(hasOnes && n > 1){
    var a = []; for(var j=0; j<n; j++) a.push([]);
    var fi = 0;
    for(var v=0; v<vals.length; v++){
      if(vals[v]===1 && fi<n){ a[fi++].push(vals[v]); }
      else { a[Math.min(fi, n-1)].push(vals[v]); }
    }
    allocs.push(a);
  }

  // (d) Biased random fill: weight by danger + enemy proximity
  var weights = [];
  for(var pi=0; pi<sols.length; pi++){
    var p = sols[pi];
    var dng = computeDanger(p, player, ce).maxP;
    var hasEnemyNear = 0;
    for(var d=1; d<=4 && !hasEnemyNear; d++){
      var ds = moveSteps(p, d, player);
      for(var di=0; di<ds.length; di++){
        if(ce[ds[di]]*player < 0){ hasEnemyNear = 1; break; }
      }
    }
    weights.push(1 + dng*2 + hasEnemyNear*3);
  }
  var safety = 0;
  while(allocs.length < nTotal && safety < nTotal*3){
    safety++;
    var a = []; for(var j=0; j<n; j++) a.push([]);
    for(var v=0; v<vals.length; v++){
      var total = 0; for(var wi=0; wi<weights.length; wi++) total += weights[wi];
      if(total <= 0){ a[Math.floor(Math.random()*n)].push(vals[v]); continue; }
      var r = Math.random() * total, cum = 0, idx = n-1;
      for(var wi=0; wi<weights.length; wi++){
        cum += weights[wi]; if(r < cum){ idx = wi; break; }
      }
      a[idx].push(vals[v]);
    }
    allocs.push(a);
  }
  return allocs;
}

// Get candidate allocations: enumerate if small, else biased sample
function tlaCandidates(vals, sols, player){
  var n = sols.length;
  var enumerated = enumAllocs(vals, n);  // returns null if > 50000
  if(enumerated !== null && enumerated.length <= 2000) return enumerated;
  return tlaBiasedAllocs(vals, sols, player, 80);
}

// Simulate an opponent's best response to a given post-self-move board.
// Uses a small candidate set (8) and scores by ahmadV from opponent's view.
// Returns score FROM MY PERSPECTIVE after opponent's best play.
function tlaOpponentResponse(postBoard, myPlayer, dontUseStackingFix){
  var opp = -myPlayer;
  // Quick terminal checks
  var oppAlive = 0, myAlive = 0;
  for(var i=0; i<SZ; i++){
    if(postBoard[i]*myPlayer > 0) myAlive += Math.abs(postBoard[i]);
    else if(postBoard[i]*myPlayer < 0) oppAlive += Math.abs(postBoard[i]);
  }
  if(oppAlive === 0) return 100000;
  if(myAlive === 0) return -100000;

  var expectedScore = 0, totalProb = 0;
  for(var si=0; si<TLA_OPP_SEQS.length; si++){
    var seq = TLA_OPP_SEQS[si].seq, prob = TLA_OPP_SEQS[si].p;

    // Build opponent's movable soldiers list given postBoard.
    // We borrow getMov logic: walk cells, find opp soldiers that can move.
    // For Lite version we approximate: any opp soldier with values that can free or step.
    var oppMovable = [];
    for(var i=0; i<SZ; i++){
      if(postBoard[i]*opp > 0){
        // Frozen check: if in own home with frozen flag, only val=1 can free.
        // Simplified: include anything non-frozen-locked or include all when seq has 1.
        var inOwnHome = isOwn(i, opp);
        var hasFrozen = inOwnHome && (fa[opp]||{})[i] > 0;
        if(hasFrozen && seq.indexOf(1) < 0) continue;
        oppMovable.push(i);
      }
    }
    if(!oppMovable.length){
      // No movement available — just score the board
      var sc = ahmadV(postBoard, myPlayer, 0);
      expectedScore += prob * sc;
      totalProb += prob;
      continue;
    }

    // Tiny candidate set: all-to-one (capped to 6 soldiers) + spread
    var oppN = Math.min(oppMovable.length, 6);
    var oppCands = [];
    for(var k=0; k<oppN; k++){
      var a = []; for(var j=0; j<oppMovable.length; j++) a.push([]);
      for(var v=0; v<seq.length; v++) a[k].push(seq[v]);
      oppCands.push(a);
    }
    if(seq.length <= oppMovable.length){
      var a = []; for(var j=0; j<oppMovable.length; j++) a.push([]);
      for(var v=0; v<seq.length; v++) a[v].push(seq[v]);
      oppCands.push(a);
    }

    // Find opponent's best (from opp's perspective)
    var bestOppScore = -1e9, bestOppCells = null;
    for(var ci=0; ci<oppCands.length && ci<8; ci++){
      var sim = simFullAlloc(postBoard, oppCands[ci], oppMovable, opp);
      var oppScore = ahmadV(sim.cells, opp, sim.captures);
      if(oppScore > bestOppScore){
        bestOppScore = oppScore;
        bestOppCells = sim.cells;
      }
    }
    if(bestOppCells === null) bestOppCells = postBoard;
    // Score from MY perspective after opponent's best play
    var myScore = ahmadV(bestOppCells, myPlayer, 0);
    expectedScore += prob * myScore;
    totalProb += prob;
  }
  return (totalProb > 0) ? (expectedScore / totalProb) : ahmadV(postBoard, myPlayer, 0);
}

// Main TLA play. isS=true applies the autopsy stacking fix.

/* Shared allocation executor - extracted from aiPlayTLA so the learned agent
   executes moves through exactly the same path (same engine-level fork picker,
   same logging, same offData bookkeeping). scoreFork picks the destination when
   a move forks; pass null to use the default ahmadV scorer. */
function tlaExecuteAlloc(player, vals, sols, bestAlloc, candCount, scoreFork){
  offData = {player:player, soldiers:sols.slice(), vals:vals.slice(),
             preCe:ce.slice(), count:candCount};
  var moved = false, n = sols.length, sn = player===1 ? 1 : -1;
  var pn2 = player===1 ? 'P1' : 'P2';

  for(var i=0; i<n; i++){
    if(!bestAlloc[i] || !bestAlloc[i].length) continue;
    var pos = sols[i];
    for(var vi=0; vi<bestAlloc[i].length; vi++){
      var val = bestAlloc[i][vi];
      if(val===1 && isOwn(pos,player) && (fa[player]||{})[pos] && canFree(pos,player)){
        var x = freeSpecific(player, pos);
        if(x.c > 0) addLog('  '+pn2+': freed '+lab(x.o)+'→'+lab(x.n)+' CAPTURED '+x.c+'!','lc');
        else addLog('  '+pn2+': freed '+lab(x.o)+'→'+lab(x.n),'la');
        moved = true; continue;
      }
      var ds = moveSteps(pos, val, player);
      if(!ds.length) continue;
      var ci = 0;
      if(ds.length > 1){
        var bestFS = -1e9;
        for(var fi=0; fi<ds.length; fi++){
          var tc = ce.slice();
          var tot2 = Math.abs(tc[pos]),
              frz2 = (fa[player]||{})[pos]||0,
              m2 = tot2 - frz2;
          if(m2 <= 0) continue;
          var mc2 = (val===1 && m2>1) ? 1 : m2;
          tc[pos] -= mc2*sn;
          if(tc[ds[fi]]*player < 0) tc[ds[fi]] = 0;
          tc[ds[fi]] += mc2*sn;
          var fs2 = scoreFork ? scoreFork(tc, player) : ahmadV(tc, player, 0);
          if(fs2 > bestFS){ bestFS = fs2; ci = fi; }
        }
      }
      var r = doMove(pos, val, player, ci);
      if(r.moved){
        moved = true;
        if(r.cap > 0) addLog('  '+pn2+': '+lab(pos)+'→'+lab(r.np)+' ('+val+') CAPTURED '+r.cap+'!','lc');
        else addLog('  '+pn2+': '+lab(pos)+'→'+lab(r.np)+' ('+val+')','la');
        lm = {from:pos, to:r.np}; pos = r.np;
      }
    }
  }
  return moved;

/* ==========================================================================
   Learned agent (TD-lambda self-play value network, 500,000 games).
   NN-TD    : argmax of V over candidate allocations  -- ranked 1st of 10
   NN-TD+LA : the same network inside TLA's one-ply lookahead -- ranked 2nd

   Fidelity note. The browser simulates board cells only; the frozen queues,
   the no-reentry taint and the started flags are carried over unchanged when
   scoring candidates. Measured against the Python reference over 600 real
   decisions this reproduces the same chosen move 98.83% of the time (the
   non-cell state changes in 7% of decisions, and the choice differs in 7 of
   those). Weights are float16, which reproduces the Python argmax exactly on
   300/300 sampled decisions; int8 was rejected at 96.25%.

var __nnReady = false;
function nnInit(){
  if(__nnReady) return true;
  try { TabNN.load(TAB_NET_JSON); __nnReady = true; }
  catch(e){ addLog('NN load failed: ' + e.message, 'lc'); return false; }
  return true;
}

function nnScoreCells(cells, player){
  return TabNN.scoreBoard(cells, fa, fq, pst, nre, player);
}

/* One-ply lookahead over the learned evaluator: marginalise the opponent's
   reply over the same three retained throw sequences TLA uses, renormalised. */
var NN_SEQS = [[[2],6/16],[[3],4/16],[[1,2],(4/16)*(6/16)]];
function nnLookahead(cells, player){
  var opp = -player, tot = 0, acc = 0;
  for(var s=0; s<NN_SEQS.length; s++){
    var seq = NN_SEQS[s][0], pr = NN_SEQS[s][1];
    tot += pr;
    var oppSols = [];
    for(var i=0;i<32;i++) if(cells[i]*opp>0) oppSols.push(i);
    if(!oppSols.length){ acc += pr * nnScoreCells(cells, player); continue; }

    var bestV = -1e9, bestCells = cells;
    for(var c=0;c<cands.length;c++){
      var sim = simFullAlloc(cells, cands[c], oppSols, opp);
      var vo = nnScoreCells(sim.cells, opp);   // opponent maximises for itself
      if(vo > bestV){ bestV = vo; bestCells = sim.cells; }
    }
    acc += pr * nnScoreCells(bestCells, player);

function aiPlayNN(player, vals, sols, useLookahead){
  if(!sols.length) return false;
  if(!nnInit()) return aiPlayTLA(player, vals, sols, true);

  var candidates = tlaCandidates(vals, sols, player);
  var bestAlloc = null, bestScore = -1e9;
  for(var ci=0; ci<candidates.length; ci++){
    var sim = simFullAlloc(ce, candidates[ci], sols, player);
    var score = useLookahead ? nnLookahead(sim.cells, player)

    if(score > bestScore){ bestScore = score; bestAlloc = candidates[ci]; }
  }

// opts (all optional) select the published ablations:
//   {}                          -> TLA      (lookahead, enumerate-or-sample, no stacking term)
//   {stack:'flat'}              -> TLA-S    (repaired stacking penalty)
//   {stack:'quad'}              -> TLE-Q    (pre-fix quadratic penalty; Section VII)
//   {noLookahead:true}          -> TLA-G    (greedy: static evaluation, no opponent model)
//   {noEnum:true}               -> TLA-B    (always samples 80 candidates, never enumerates)
function aiPlayTLA(player, vals, sols, isS, opts){
  if(!sols.length) return false;
  opts = opts || {};
  var stackMode = opts.stack || (isS ? 'flat' : 'none');

  var candidates = opts.noEnum ? tlaBiasedAllocs(vals, sols, player, 80)
                               : tlaCandidates(vals, sols, player);
  var bestAlloc = null, bestScore = -1e9;
  var origCells = ce.slice();

  for(var ci=0; ci<candidates.length; ci++){
    var alloc = candidates[ci];
    var sim = simFullAlloc(ce, alloc, sols, player);
    // TLA-G scores the resulting position statically; the others marginalize
    // over the opponent's likely replies (one-ply lookahead).
    var score = opts.noLookahead
                  ? ahmadV(sim.cells, player, 0)
                  : tlaOpponentResponse(sim.cells, player, stackMode !== 'flat');
    if(stackMode === 'flat'){
      score += tlaStackingDelta(sim.cells, origCells, player);
    } else if(stackMode === 'quad'){
      score += tleStackingDelta(sim.cells, origCells, player);
    }
    // Tiny capture bonus to ensure captures are valued in current turn
    score += sim.captures * 8.0;
    if(score > bestScore){ bestScore = score; bestAlloc = alloc; }
  }

    for(var vi=0; vi<bestAlloc[i].length; vi++){
      var val = bestAlloc[i][vi];

        if(x.c > 0) addLog('  '+pn2+': freed '+lab(x.o)+'→'+lab(x.n)+' CAPTURED '+x.c+'!','lc');
        else addLog('  '+pn2+': freed '+lab(x.o)+'→'+lab(x.n),'la');
        moved = true; continue;
      }
      var ds = moveSteps(pos, val, player);
      if(!ds.length) continue;
      var ci = 0;
      if(ds.length > 1){
        // Smart fork picker: score each destination with the same evaluator
        var bestFS = -1e9;
        for(var fi=0; fi<ds.length; fi++){
          var tc = ce.slice();
          var tot2 = Math.abs(tc[pos]),
              frz2 = (fa[player]||{})[pos]||0,
              m2 = tot2 - frz2;

          var mc2 = (val===1 && m2>1) ? 1 : m2;
          tc[pos] -= mc2*sn;
          if(tc[ds[fi]]*player < 0) tc[ds[fi]] = 0;
          tc[ds[fi]] += mc2*sn;
          var fs2 = ahmadV(tc, player, 0);
          if(stackMode === 'flat') fs2 += tlaStackingDelta(tc, ce, player);
          else if(stackMode === 'quad') fs2 += tleStackingDelta(tc, ce, player);
          if(fs2 > bestFS){ bestFS = fs2; ci = fi; }
        }
      }
      var r = doMove(pos, val, player, ci);
      if(r.moved){
        moved = true;
        if(r.cap > 0) addLog('  '+pn2+': '+lab(pos)+'→'+lab(r.np)+' ('+val+') CAPTURED '+r.cap+'!','lc');
        else addLog('  '+pn2+': '+lab(pos)+'→'+lab(r.np)+' ('+val+')','la');
        lm = {from:pos, to:r.np}; pos = r.np;
      }
    }
  }
  return moved;
}

  var vy1=PD+1*CL;cx.beginPath();cx.moveTo(PD+C*CL-10,vy1+CL/2);cx.lineTo(PD+10,vy1+CL/2);cx.stroke();dArr(cx,PD+15,vy1+CL/2,-1);
  cx.setLineDash([3,3]);cx.strokeStyle='rgba(180,160,120,0.25)';
  for(var c2=0;c2<C;c2++){var x2=PD+c2*CL+CL/2;cx.beginPath();cx.moveTo(x2,PD+3*CL);cx.lineTo(x2,PD+2*CL+CL);cx.stroke();cx.beginPath();cx.moveTo(x2,PD+CL);cx.lineTo(x2,PD+1*CL);cx.stroke()}
  cx.strokeStyle='rgba(0,255,136,0.25)';
  cx.beginPath();cx.moveTo(PD+7*CL+CL/2,vy2);cx.lineTo(PD+7*CL+CL/2,vy1+CL);cx.stroke();
  cx.beginPath();cx.moveTo(PD+CL/2,vy1+CL);cx.lineTo(PD+CL/2,vy2);cx.stroke();
  cx.setLineDash([]);

  for(var pos=0;pos<SZ;pos++){
    var rw=gr(pos),co=gc(pos),vr2=vrow(rw),x=PD+co*CL,y=PD+vr2*CL;
    cx.fillStyle=bg[rw];cx.beginPath();cx.roundRect(x,y,CL,CL,4);cx.fill();
    cx.strokeStyle='#5A4A2A';cx.lineWidth=1;cx.stroke();
    cx.beginPath();cx.arc(x+CL/2,y+CL/2,CL/2-6,0,Math.PI*2);cx.strokeStyle='rgba(80,60,30,.2)';cx.lineWidth=1;cx.stroke();
    if(!viewing){
      if(ph==='alloc'&&mv.indexOf(pos)>=0&&ss===null){cx.strokeStyle='#00FF88';cx.lineWidth=2;cx.beginPath();cx.roundRect(x+2,y+2,CL-4,CL-4,6);cx.stroke()}
      if(ss===pos){cx.fillStyle='rgba(0,255,136,.15)';cx.beginPath();cx.roundRect(x+2,y+2,CL-4,CL-4,6);cx.fill();cx.strokeStyle='#00FF88';cx.lineWidth=3;cx.stroke()}
    }
    if(lm&&(lm.from===pos||lm.to===pos)){cx.strokeStyle=lm.to===pos?'#FF4444':'#FF8800';cx.lineWidth=2;cx.setLineDash([4,4]);cx.beginPath();cx.roundRect(x+2,y+2,CL-4,CL-4,6);cx.stroke();cx.setLineDash([])}
    var v=ce[pos];
    if(v!==0){
      var ip=v>0;cx.beginPath();cx.arc(x+CL/2,y+CL/2,CL/2-9,0,Math.PI*2);
      var g=cx.createRadialGradient(x+CL/2-4,y+CL/2-4,4,x+CL/2,y+CL/2,CL/2-9);
      if(ip){g.addColorStop(0,'#FFD700');g.addColorStop(1,'#B8860B')}else{g.addColorStop(0,'#E0E0E0');g.addColorStop(1,'#707070')}
      cx.fillStyle=g;cx.fill();cx.strokeStyle=ip?'#8B6914':'#505050';cx.lineWidth=2;cx.stroke();
      if(Math.abs(v)>1){cx.fillStyle=ip?'#3A2000':'#222';cx.font='bold '+Math.round(15*fs)+'px Segoe UI';cx.textAlign='center';cx.textBaseline='middle';cx.fillText(Math.abs(v),x+CL/2,y+CL/2)}
      var pl2=ip?1:-1;
      if(isOwn(pos,pl2)&&(fa[pl2]||{})[pos]>0){
        cx.fillStyle='rgba(100,100,200,0.35)';cx.beginPath();cx.arc(x+CL/2,y+CL/2,CL/2-9,0,Math.PI*2);cx.fill();
        cx.fillStyle='#8888CC';cx.font='bold '+Math.round(9*fs)+'px Segoe UI';cx.textAlign='center';cx.textBaseline='middle';
        cx.fillText('āṣ',x+CL/2,y+CL/2+15);
      }
      
      if(isEnm(pos,pl2)&&hasActiveElsewhere(pl2)){
  	cx.fillStyle='rgba(255,215,0,0.4)';cx.beginPath();cx.arc(x+CL/2,y+CL/2,CL/2-9,0,Math.PI*2);cx.fill();
  	cx.fillStyle='#3A2000';cx.font='bold '+Math.round(10*fs)+'px Segoe UI';cx.textAlign='center';cx.textBaseline='middle';
  	cx.fillText('❄',x+CL/2+12,y+CL/2-12);
      }

      // NO RE-ENTRY: show taint marker on battlefield soldiers
      var tStk=(nre[pl2]||{})[pos]||[];
      if(tStk.length>0){var hasT=false;for(var ti=0;ti<tStk.length;ti++){if(tStk[ti])hasT=true}
        if(hasT){cx.fillStyle='#FF4444';cx.font='bold '+Math.round(9*fs)+'px Segoe UI';cx.textAlign='center';cx.textBaseline='middle';
          cx.fillText('⊘',x+CL/2-12,y+CL/2-12)}}
    }
  }
  // Destination highlights
  if(!viewing&&ss!==null&&destHL.length>0){
    for(var di=0;di<destHL.length;di++){
      var d=destHL[di],dpos=d.pos,dco=gc(dpos),dvr=vrow(gr(dpos));
      var dx=PD+dco*CL,dy=PD+dvr*CL;
      var isEH=isEnm(dpos,1),isCap=ce[dpos]*1<0;
      cx.strokeStyle=isCap?'#FF3333':isEH?'#FF8C00':'#FFD700';
      cx.lineWidth=3;cx.setLineDash([6,4]);
      cx.beginPath();cx.roundRect(dx+3,dy+3,CL-6,CL-6,6);cx.stroke();cx.setLineDash([]);
      cx.fillStyle=isCap?'rgba(255,50,50,.15)':isEH?'rgba(255,140,0,.15)':'rgba(255,215,0,.15)';
      cx.beginPath();cx.roundRect(dx+3,dy+3,CL-6,CL-6,6);cx.fill();
      cx.fillStyle=isCap?'#FF6666':'#FFD700';cx.font='bold '+Math.round(16*fs)+'px Segoe UI';cx.textAlign='center';cx.textBaseline='middle';
      var lbl=d.isFree?'āṣ':d.val.toString();
      if(isEH&&!d.isFree)lbl+='\u2744';
      cx.fillText(lbl,dx+CL/2,dy+CL/2+(ce[dpos]!==0?18:0));
    }
  }
  cx.fillStyle='#A09070';cx.font='bold '+Math.round(13*fs)+'px Segoe UI';cx.textAlign='center';
  ['D','C','B','A'].forEach(function(l,i){cx.fillText(l,11,PD+i*CL+CL/2+4)});
  cx.font=Math.round(11*fs)+'px Segoe UI';for(var c3=0;c3<C;c3++)cx.fillText(c3+1,PD+c3*CL+CL/2,R*CL+PD+Math.round(16*fs));
  var a=0,b=0;for(var i=0;i<SZ;i++){if(ce[i]>0)a+=ce[i];if(ce[i]<0)b-=ce[i]}
  document.getElementById('yc').textContent=a;document.getElementById('ac').textContent=b;
  document.getElementById('p1cap').textContent=p1cap>0?'(captured '+p1cap+')':'';
  document.getElementById('p2cap').textContent=p2cap>0?'(captured '+p2cap+')':'';
}
function dArr(cx,x,y,dir){cx.beginPath();cx.moveTo(x,y);cx.lineTo(x-dir*7,y-4);cx.moveTo(x,y);cx.lineTo(x-dir*7,y+4);cx.stroke()}
document.getElementById('bd').addEventListener('click',function(e){
  var r=e.target.getBoundingClientRect();var x=e.clientX-r.left-PD,y=e.clientY-r.top-PD;
  var co=Math.floor(x/CL),vr3=Math.floor(y/CL);
  if(co<0||co>=C||vr3<0||vr3>=R)return;cellCk((3-vr3)*C+co);
});

// =====================================================================
// UI
// =====================================================================
function doUI(){
  var st=document.getElementById('st'),tb=document.getElementById('tb');
  var dpn=document.getElementById('dpn'),sk=document.getElementById('sk');
  st.className='st';
  if(viewing)st.innerHTML='📜 <b>Reviewing history</b> — click ▶▶ to return';
  else if(ph==='wait')st.innerHTML=aim?'🤖 AI vs AI...':'🎲 Click <b>"Throw Sticks"</b>!';
  else if(ph==='alloc'&&ss===null)st.innerHTML='👆 <b>Click a soldier</b> to see moves';
  else if(ph==='alloc'&&ss!==null){
    if(isFrozenAt(ss,1))st.innerHTML='🪵 <b>'+lab(ss)+'</b> (āṣram) — click destination to free';
    else st.innerHTML='🎯 <b>'+lab(ss)+'</b> — click a golden destination';
  }
  else if(ph==='over'){st.innerHTML=wn===1?'🎉 <b>'+(aim?'P1':'You')+' won!</b>':'💀 <b>'+(aim?'P2':'AI')+' won!</b>';st.classList.add(wn===1?'w':'l')}
  tb.disabled=ph!=='wait'||aim||viewing;
  if(!viewing&&ph==='alloc'&&rm.length>0){
    dpn.style.display='block';document.getElementById('ts').textContent='['+ts.join(', ')+']';
    document.getElementById('valinfo').textContent='Remaining: ['+rm.join(', ')+']'+(ss!==null?' — '+lab(ss):'');
    sk.style.display='inline-block';
  }else{dpn.style.display='none';sk.style.display='none'}
  updNav();
}

function addLog(m,c){var l=document.getElementById('lg'),d=document.createElement('div');d.className=c||'ln';d.textContent=m;l.appendChild(d);l.scrollTop=l.scrollHeight}
function boardSnap(){var s='BOARD:';for(var i=0;i<SZ;i++){if(i>0&&i%C===0)s+='|';s+=ce[i]>=0?'+'+ce[i]:ce[i].toString()}
  s+=' FQ1:['+fq[1].map(function(p){return lab(p)}).join(',')+']';s+=' FQ2:['+fq[-1].map(function(p){return lab(p)}).join(',')+']';return s}
// Canonical agent names. These are the identifiers used in the paper, so an
// exported log or a screenshot can be matched to a row of Table VII without
// having to consult the source. Values not listed here are prototype bots that
// the paper does not evaluate.
var AGENT_NAMES = {
  nnla:'TLA-NN', nn:'TD-Greedy', tlas:'TLA-S', tla:'TLA', tlab:'TLA-B',
  tlag:'TLA-G', original:'GA-Original', psa:'PSA'
};
function agentLabel(v){ return AGENT_NAMES[v] || v; }

// Keep the on-screen engine indicator in step with the two dropdowns, so a
// screenshot of any position always says which agents produced it.
function updMatchup(){
  var el = document.getElementById('matchup');
  if(!el) return;
  el.innerHTML = aim
    ? 'Engines — P1: <b>' + agentLabel(aiModeP1) + '</b> &nbsp;|&nbsp; P2: <b>' +
      agentLabel(aiModeP2) + '</b>'
    : 'Human (P1) vs <b>' + agentLabel(aiModeP2) + '</b> (P2)';
}

// ── Auto-save game log system ────────────────────────────────────────────────
var gameCounter = parseInt(localStorage.getItem('tabGameCounter')||'0');

function getGameType(){
  // Returns folder prefix based on who played
  if(!aim) return 'HumanVsAgent';          // human vs AI
  var nm=AGENT_NAMES;
  var p1=nm[aiModeP1]||aiModeP1;
  var p2=nm[aiModeP2]||aiModeP2;
  return 'Agent_'+p1+'_vs_'+p2;
}

function buildLogText(){
  // Build the full game log text matching Ahmad game format
  var lines=[];
  // Header
  if(!aim) lines.push('P1-Human Vs AI');
  else {
    lines.push('P1: '+agentLabel(aiModeP1)+' Vs P2: '+agentLabel(aiModeP2));
  }
  var divs=document.getElementById('lg').getElementsByTagName('div');
  for(var i=0;i<divs.length;i++) lines.push(divs[i].textContent);
  return lines.join('\n');
}

// autoSaveGame defined below with toggle support

function exportLog(){
  // Manual export (copy to clipboard or open in new tab)
  var text=buildLogText();
  if(navigator.clipboard){
    navigator.clipboard.writeText(text)
      .then(function(){alert('Log copied to clipboard!')})
      .catch(function(){var w=window.open('','_blank');w.document.write('<pre>'+text.replace(/</g,'&lt;')+'</pre>')})
  } else {
    var w=window.open('','_blank');
    w.document.write('<pre>'+text.replace(/</g,'&lt;')+'</pre>');
  }
}


var autoSaveEnabled = (localStorage.getItem('tabAutoSave')!=='off');
function togAutoSave(){
  autoSaveEnabled=!autoSaveEnabled;
  localStorage.setItem('tabAutoSave',autoSaveEnabled?'on':'off');
  var b=document.getElementById('asBtn');
  if(b) b.textContent='💾 Auto-Save: '+(autoSaveEnabled?'ON':'OFF');
}
function autoSaveGame(){
  if(!autoSaveEnabled) return;
  var text=buildLogText();
  var type=getGameType();
  var now=new Date();
  var ts=now.getFullYear()+''
    +String(now.getMonth()+1).padStart(2,'0')
    +String(now.getDate()).padStart(2,'0')+'_'
    +String(now.getHours()).padStart(2,'0')
    +String(now.getMinutes()).padStart(2,'0')
    +String(now.getSeconds()).padStart(2,'0');
  gameCounter++;
  localStorage.setItem('tabGameCounter',gameCounter);
  var winner=wn===1?'P1wins':'P2wins';
  var fname=type+'_game'+String(gameCounter).padStart(4,'0')+'_'+ts+'_'+winner+'.txt';
  var blob=new Blob([text],{type:'text/plain'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=fname;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(a.href)},5000);
}
init();doUI();resizeBoard();
// Restore auto-save button state
(function(){var b=document.getElementById('asBtn');if(b)b.textContent='💾 Auto-Save: '+(autoSaveEnabled?'ON':'OFF');})();
var sel1=document.getElementById('aiSel1');if(sel1)aiModeP1=sel1.value;
var sel2=document.getElementById('aiSel2');if(sel2)aiModeP2=sel2.value;
// Legacy fallback for human vs AI (uses P2 selector)
var selL=document.getElementById('aiSel2');if(selL)aiMode=selL.value;
updMatchup();
</script>
